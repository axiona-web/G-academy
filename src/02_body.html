<body class="bg-surface-light dark:bg-surface-dark text-zinc-800 dark:text-zinc-200 font-sans min-h-screen">

<!-- ═══════════════ APP SHELL ═══════════════
     Layout: fixný sidebar (desktop) / spodná lišta (mobil) + hlavný obsah.
     Obsah jednotlivých obrazoviek renderuje JS do #main. -->
<div id="app" class="flex min-h-screen">

  <!-- ── SIDEBAR (desktop) ── -->
  <aside id="sidebar" class="hidden lg:flex flex-col w-64 shrink-0 h-screen sticky top-0 border-r border-zinc-200 dark:border-zinc-800/80 bg-white/70 dark:bg-[#0c0c0f]/80 backdrop-blur-xl">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 h-16 border-b border-zinc-200 dark:border-zinc-800/80">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-extrabold text-sm shadow-lg shadow-indigo-500/30">G</div>
      <div>
        <div class="font-bold text-sm tracking-tight text-zinc-900 dark:text-white">G-Academy</div>
        <div class="text-[10px] text-zinc-500 -mt-0.5">GBP · GSC · Ads</div>
      </div>
    </div>
    <!-- Navigácia -->
    <nav id="nav-desktop" class="flex-1 overflow-y-auto py-4 px-3 space-y-0.5 text-sm"></nav>
    <!-- Spodok sidebaru: level + streak -->
    <div id="sidebar-footer" class="p-4 border-t border-zinc-200 dark:border-zinc-800/80"></div>
  </aside>

  <!-- ── HLAVNÝ OBSAH ── -->
  <div class="flex-1 min-w-0 flex flex-col">
    <!-- Topbar -->
    <header class="sticky top-0 z-30 h-16 flex items-center justify-between gap-3 px-4 sm:px-8 border-b border-zinc-200 dark:border-zinc-800/80 bg-white/70 dark:bg-[#0c0c0f]/70 backdrop-blur-xl">
      <div class="flex items-center gap-3 min-w-0">
        <div class="lg:hidden w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-extrabold text-sm">G</div>
        <h1 id="page-title" class="font-bold text-base sm:text-lg tracking-tight text-zinc-900 dark:text-white truncate">Prehľad</h1>
      </div>
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Prihlásený používateľ (vypĺňa Auth modul) -->
        <div id="topbar-user"></div>
        <!-- Streak -->
        <div id="topbar-streak" class="chip bg-orange-500/10 text-orange-500" title="Séria dní učenia">🔥 0</div>
        <!-- XP -->
        <div id="topbar-xp" class="chip bg-indigo-500/10 text-indigo-400" title="Skúsenostné body">⚡ 0 XP</div>
        <!-- Prepínač témy -->
        <button id="theme-toggle" onclick="App.toggleTheme()" class="btn-press w-9 h-9 rounded-xl border border-zinc-200 dark:border-zinc-700/70 flex items-center justify-center hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" title="Prepnúť tému">
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
        </button>
      </div>
    </header>

    <!-- Obsah obrazovky (renderuje router) -->
    <main id="main" class="flex-1 px-4 sm:px-8 py-6 pb-28 lg:pb-10 max-w-6xl w-full mx-auto"></main>
  </div>
</div>

<!-- ── MOBILNÁ NAVIGÁCIA (spodná lišta) ── -->
<nav id="nav-mobile" class="lg:hidden fixed bottom-0 inset-x-0 z-40 flex justify-around items-center h-16 border-t border-zinc-200 dark:border-zinc-800 bg-white/90 dark:bg-[#0c0c0f]/90 backdrop-blur-xl"></nav>

<!-- ── TOAST notifikácie (XP, achievementy) ── -->
<div id="toasts" class="fixed top-20 right-4 z-50 space-y-2 w-72 pointer-events-none"></div>

<!-- ── MODÁLNE OKNO (testy, potvrdenia) ── -->
<div id="modal-root"></div>
