Views.afterRender.stats = () => {
  const dark = App.state.theme === 'dark';
  const grid = dark ? '#27272a' : '#e4e4e7';
  const tick = dark ? '#a1a1aa' : '#52525b';
  Chart.defaults.font.family = 'Inter, sans-serif';
  Chart.defaults.color = tick;

  /* Čas učenia — 14 dní */
  const days = [...Array(14)].map((_, i) => {
    const d = new Date(Date.now() - (13 - i) * 864e5);
    const k = d.toISOString().slice(0, 10);
    return { label: d.toLocaleDateString('sk', { day: 'numeric', month: 'numeric' }), min: App.state.timeLog[k] || 0 };
  });
  new Chart(document.getElementById('ch-time'), {
    type: 'bar',
    data: { labels: days.map(d => d.label), datasets: [{ label: 'minúty', data: days.map(d => d.min), backgroundColor: '#6366f1', borderRadius: 6 }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: grid }, beginAtZero: true } } },
  });

  /* Úspešnosť testov v čase */
  const tests = App.state.testHistory.slice(-15);
  new Chart(document.getElementById('ch-tests'), {
    type: 'line',
    data: {
      labels: tests.map(t => new Date(t.date).toLocaleDateString('sk', { day: 'numeric', month: 'numeric' })),
      datasets: [{ label: '%', data: tests.map(t => Math.round(t.score / t.total * 100)), borderColor: '#10b981', backgroundColor: '#10b98130', fill: true, tension: 0.35, pointRadius: 4 }],
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: grid }, min: 0, max: 100 } } },
  });

  /* Progres modulov */
  new Chart(document.getElementById('ch-modules'), {
    type: 'bar',
    data: {
      labels: DATA.modules.map(m => m.short),
      datasets: [{ data: DATA.modules.map(m => App.moduleProgress(m.id)), backgroundColor: DATA.modules.map(m => m.color), borderRadius: 8 }],
    },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { grid: { color: grid }, min: 0, max: 100 }, y: { grid: { display: false } } } },
  });

  /* Radar: silné/slabé stránky */
  const radarData = DATA.modules.map(m => {
    const t = App.state.testHistory.filter(x => x.id.includes(m.id));
    return t.length ? Math.round(t.reduce((a, x) => a + x.score / x.total, 0) / t.length * 100) : 0;
  });
  new Chart(document.getElementById('ch-radar'), {
    type: 'radar',
    data: { labels: DATA.modules.map(m => m.short), datasets: [{ label: 'úspešnosť testov %', data: radarData, borderColor: '#a855f7', backgroundColor: '#a855f730', pointBackgroundColor: '#a855f7' }] },
    options: { plugins: { legend: { display: false } }, scales: { r: { grid: { color: grid }, angleLines: { color: grid }, min: 0, max: 100, ticks: { display: false } } } },
  });

  /* Splnené moduly + certifikácie (doughnut) */
  const modsDone = DATA.modules.filter(m => App.moduleProgress(m.id) >= 100).length;
  const certsDone = Object.values(App.state.certs).filter(c => c.done).length;
  new Chart(document.getElementById('ch-done'), {
    type: 'doughnut',
    data: {
      labels: ['Moduly hotové', 'Moduly zostáva', 'Certifikácie hotové', 'Certifikácie zostáva'],
      datasets: [
        { data: [modsDone, DATA.modules.length - modsDone], backgroundColor: ['#10b981', dark ? '#27272a' : '#e4e4e7'], circumference: 180, rotation: 270 },
        { data: [certsDone, DATA.certs.length - certsDone], backgroundColor: ['#a855f7', dark ? '#3f3f46' : '#d4d4d8'], circumference: 180, rotation: 270 },
      ],
    },
    options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } },
  });

  /* Pripravenosť na certifikácie */
  document.getElementById('cert-ready-list').innerHTML = DATA.certs.map(c => {
    const r = App.certReadiness(c);
    const color = r >= 75 ? '#10b981' : r >= 45 ? '#f59e0b' : '#ef4444';
    return `<div><div class="flex justify-between text-xs mb-1"><span class="text-zinc-600 dark:text-zinc-400">${c.name}</span><b style="color:${color}">${r} %</b></div>
      <div class="h-1.5 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full" style="background:${color};width:${r}%"></div></div></div>`;
  }).join('');
};

/* ═══════════════ Štart aplikácie ═══════════════
   Bootstrap prevzal Auth modul (src/12_auth.js):
   - bez Supabase konfigurácie → lokálny režim (App.init priamo)
   - s konfiguráciou → registrácia/prihlásenie + cloud sync */
document.addEventListener('DOMContentLoaded', () => Auth.boot());
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   AUTH — registrácia, prihlásenie, roly a cloud sync (Supabase)
   ───────────────────────────────────────────────────────────────────
   Režimy:
   • Lokálny — config.js nemá vyplnené kľúče → aplikácia beží ako
     doteraz (localStorage), bez prihlasovania. Vhodné na vývoj.
   • Online — s kľúčmi Supabase: povinná registrácia/prihlásenie,
     progres sa synchronizuje k účtu, admin vidí zoznam študentov.
   Monetizácia (budúcnosť): profiles.plan ('free'/'premium') +
   Auth.hasAccess() — miesto, kde sa neskôr zapoja platené bloky.
   ═══════════════════════════════════════════════════════════════════ */

const Auth = {
  sb: null,          // Supabase klient
  user: null,        // aktuálny auth používateľ
  profile: null,     // riadok z tabuľky profiles (role, plan…)
  _syncTimer: null,

  configured() {
    const c = window.GACADEMY_CONFIG;
    return !!(c && c.SUPABASE_URL && c.SUPABASE_ANON_KEY && window.supabase);
  },
  isAdmin() { return this.profile?.role === 'admin'; },
  /* Budúce platené bloky: tu sa neskôr skontroluje profile.plan */
  hasAccess(/* blockId */) { return true; },

  /* ── Bootstrap aplikácie ── */
  async boot() {
    if (!this.configured()) {
      // lokálny režim — aplikuj lokálne obsahové úpravy a štartuj
      if (typeof Content !== 'undefined') await Content.load();
      App.init(); return;
    }
    this.sb = window.supabase.createClient(GACADEMY_CONFIG.SUPABASE_URL, GACADEMY_CONFIG.SUPABASE_ANON_KEY);
    const { data: { session } } = await this.sb.auth.getSession();
    if (session) await this.onLogin(session.user);
    else this.renderGate();
    // reaguj na zmeny session (odhlásenie v inom tabe a pod.)
    this.sb.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') location.reload();
    });
  },

  /* ── Po prihlásení: profil, cloud stav, štart aplikácie ── */
  async onLogin(user) {
    this.user = user;
    // profil (rola, plán) — vytvára ho DB trigger pri registrácii
    const { data: prof } = await this.sb.from('profiles').select('*').eq('id', user.id).single();
    this.profile = prof || { role: 'student', plan: 'free' };
    // localStorage kľúč per používateľ (aby sa účty na 1 počítači nemiešali)
    App.KEY = 'gacademy_v1_' + user.id;
    App.load();
    // cloud stav: použij ten s vyšším XP (jednoduchá deterministická stratégia)
    try {
      const { data: row } = await this.sb.from('progress').select('state').eq('user_id', user.id).single();
      if (row && row.state && (row.state.xp || 0) >= (App.state.xp || 0)) {
        App.state = Object.assign(App.defaultState(), row.state);
        App.save();
      }
    } catch (e) { /* prvé prihlásenie — riadok ešte neexistuje */ }
    // obal App.save → každá zmena naplánuje cloud sync (debounce 4 s)
    const origSave = App.save.bind(App);
    App.save = () => { origSave(); this.scheduleSync(); };
    window.addEventListener('beforeunload', () => this.syncNow());
    document.getElementById('auth-gate')?.remove();
    // Obsahové úpravy (admin editor) — aplikovať pred prvým renderom
    if (typeof Content !== 'undefined') await Content.load();
    App.init();
    this.renderUserChip();
    this.syncNow();
  },

  /* ── Cloud sync progresu ── */
  scheduleSync() {
    clearTimeout(this._syncTimer);
    this._syncTimer = setTimeout(() => this.syncNow(), 4000);
  },
  async syncNow() {
    if (!this.sb || !this.user) return;
    try {
      await this.sb.from('progress').upsert({
        user_id: this.user.id,
        state: App.state,
        overall: App.overallProgress(),
        xp: App.state.xp,
        level: App.level().name,
        updated_at: new Date().toISOString(),
      });
    } catch (e) { console.warn('sync fail', e); }
  },

  async logout() {
    await this.syncNow();
    await this.sb.auth.signOut();
    location.reload();
  },

  /* ── Chip prihláseného používateľa v topbare ── */
  renderUserChip() {
    const el = document.getElementById('topbar-user');
    if (!el || !this.user) return;
    const name = this.profile?.full_name || this.user.email.split('@')[0];
    el.innerHTML = `
      <div class="flex items-center gap-1.5">
        <span class="chip bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 max-w-[130px]" title="${this.user.email}">
          ${this.isAdmin() ? '🛡️ ' : '👤 '}<span class="truncate">${name}</span>
        </span>
        <button onclick="Auth.logout()" title="Odhlásiť sa" class="btn-press w-9 h-9 rounded-xl border border-zinc-200 dark:border-zinc-700/70 flex items-center justify-center hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>`;
    if (window.lucide) lucide.createIcons();
  },

  /* ── Prihlasovacia / registračná brána ── */
  renderGate(mode = 'login', msg = '') {
    let gate = document.getElementById('auth-gate');
    if (!gate) {
      gate = document.createElement('div');
      gate.id = 'auth-gate';
      document.body.appendChild(gate);
    }
    const isReg = mode === 'register';
    gate.innerHTML = `
    <div class="fixed inset-0 z-[100] overflow-y-auto bg-surface-light dark:bg-surface-dark flex items-center justify-center p-4">
      <div class="w-full max-w-md animate-slide-up">
        <div class="text-center mb-6">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-indigo-500/30 mb-3">G</div>
          <h1 class="text-2xl font-extrabold text-zinc-900 dark:text-white">G-Academy</h1>
          <p class="text-sm text-zinc-500">Google Business Profile · Search Console · Google Ads</p>
        </div>
        <div class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316] p-6">
          <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-zinc-100 dark:bg-zinc-800/70 mb-5">
            <button onclick="Auth.renderGate('login')" class="py-2 rounded-lg text-sm font-semibold transition ${!isReg ? 'bg-white dark:bg-[#131316] shadow text-zinc-900 dark:text-white' : 'text-zinc-500'}">Prihlásenie</button>
            <button onclick="Auth.renderGate('register')" class="py-2 rounded-lg text-sm font-semibold transition ${isReg ? 'bg-white dark:bg-[#131316] shadow text-zinc-900 dark:text-white' : 'text-zinc-500'}">Registrácia</button>
          </div>
          ${msg ? `<div class="mb-4 text-sm rounded-xl px-3 py-2.5 ${msg.startsWith('✅') ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-400'}">${msg}</div>` : ''}
          ${isReg ? `
            <label class="text-xs font-semibold text-zinc-500">Meno</label>
            <input id="auth-name" placeholder="Tvoje meno" class="w-full mt-1 mb-3 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2.5 text-sm outline-none focus:border-indigo-500">` : ''}
          <label class="text-xs font-semibold text-zinc-500">E-mail</label>
          <input id="auth-email" type="email" placeholder="tvoj@email.sk" class="w-full mt-1 mb-3 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2.5 text-sm outline-none focus:border-indigo-500">
          <label class="text-xs font-semibold text-zinc-500">Heslo</label>
          <input id="auth-pass" type="password" placeholder="min. 6 znakov" onkeydown="if(event.key==='Enter')Auth.${isReg ? 'register' : 'login'}()"
            class="w-full mt-1 mb-5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2.5 text-sm outline-none focus:border-indigo-500">
          <button onclick="Auth.${isReg ? 'register' : 'login'}()" id="auth-submit"
            class="btn-press w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition">
            ${isReg ? 'Vytvoriť účet zadarmo' : 'Prihlásiť sa'}
          </button>
          ${isReg
            ? '<p class="text-[11px] text-zinc-500 mt-4 text-center">Registrácia je bezplatná. Získaš prístup ku všetkým lekciám, testom a projektom.</p>'
            : `<button onclick="Auth.resetPassword()" class="w-full text-center text-xs text-zinc-500 hover:text-indigo-400 mt-4">Zabudnuté heslo?</button>`}
        </div>
        <p class="text-center text-[11px] text-zinc-500 mt-4">Progres sa ukladá k tvojmu účtu — môžeš sa učiť z hociktorého zariadenia.</p>
      </div>
    </div>`;
  },
  _busy(b) {
    const btn = document.getElementById('auth-submit');
    if (btn) { btn.disabled = b; btn.textContent = b ? 'Moment…' : btn.textContent; }
  },

  async login() {
    const email = document.getElementById('auth-email').value.trim();
    const pass = document.getElementById('auth-pass').value;
    if (!email || !pass) return this.renderGate('login', 'Vyplň e-mail aj heslo.');
    this._busy(true);
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pass });
    if (error) return this.renderGate('login', this.slovak(error.message));
    await this.onLogin(data.user);
  },

  async register() {
    const name = document.getElementById('auth-name').value.trim();
    const email = document.getElementById('auth-email').value.trim();
    const pass = document.getElementById('auth-pass').value;
    if (!name || !email || !pass) return this.renderGate('register', 'Vyplň všetky polia.');
    if (pass.length < 6) return this.renderGate('register', 'Heslo musí mať aspoň 6 znakov.');
    this._busy(true);
    const { data, error } = await this.sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
    if (error) return this.renderGate('register', this.slovak(error.message));
    // Ak je v Supabase zapnuté potvrdenie e-mailu, session ešte nie je aktívna
    if (!data.session) return this.renderGate('login', '✅ Účet vytvorený! Skontroluj e-mail a potvrď registráciu, potom sa prihlás.');
    await this.onLogin(data.user);
  },

  async resetPassword() {
    const email = document.getElementById('auth-email').value.trim();
    if (!email) return this.renderGate('login', 'Napíš svoj e-mail do poľa vyššie a klikni znova na „Zabudnuté heslo".');
    await this.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    this.renderGate('login', '✅ Ak účet existuje, poslali sme ti e-mail na obnovu hesla.');
  },

  /* Preklad najčastejších chýb Supabase */
  slovak(msg) {
    const map = {
      'Invalid login credentials': 'Nesprávny e-mail alebo heslo.',
      'User already registered': 'Tento e-mail už má účet — skús sa prihlásiť.',
      'Email not confirmed': 'E-mail ešte nie je potvrdený — skontroluj schránku.',
      'Password should be at least 6 characters': 'Heslo musí mať aspoň 6 znakov.',
    };
    for (const k in map) if (msg.includes(k)) return map[k];
    return '⚠️ ' + msg;
  },
};

/* ═══════════════ ADMIN — prehľad študentov ═══════════════ */
Views.admin = function () {
  return `
  <p class="text-sm text-zinc-500 mb-4">🛡️ Administrátorská sekcia — zoznam registrovaných študentov a ich progres (dáta zo Supabase).</p>
  <div id="admin-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
  ${this.card(`<div id="admin-table" class="text-sm text-zinc-500">Načítavam študentov…</div>`)}`;
};
Views.afterRender.admin = async () => {
  if (!Auth.isAdmin()) { document.getElementById('admin-table').innerHTML = 'Prístup len pre administrátora.'; return; }
  try {
    const [{ data: profiles }, { data: progress }] = await Promise.all([
      Auth.sb.from('profiles').select('*').order('created_at', { ascending: false }),
      Auth.sb.from('progress').select('user_id, overall, xp, level, updated_at'),
    ]);
    const progMap = Object.fromEntries((progress || []).map(p => [p.user_id, p]));
    const rows = (profiles || []).map(p => ({ ...p, prog: progMap[p.id] }));
    // súhrnné karty
    const active7 = rows.filter(r => r.prog && (Date.now() - new Date(r.prog.updated_at)) < 7 * 864e5).length;
    const avgProgress = rows.length ? Math.round(rows.reduce((a, r) => a + (r.prog?.overall || 0), 0) / rows.length) : 0;
    document.getElementById('admin-stats').innerHTML =
      Views.statCard('users', rows.length, 'Registrovaných', '#6366f1') +
      Views.statCard('activity', active7, 'Aktívni (7 dní)', '#10b981') +
      Views.statCard('percent', avgProgress + ' %', 'Priemerný progres', '#f59e0b') +
      Views.statCard('shield', rows.filter(r => r.role === 'admin').length, 'Adminov', '#a855f7');
    // tabuľka
    document.getElementById('admin-table').innerHTML = `
      <div class="overflow-x-auto"><table class="w-full text-sm">
        <thead><tr class="text-left text-xs text-zinc-500 border-b border-zinc-200 dark:border-zinc-800">
          <th class="py-2 pr-3">Používateľ</th><th class="py-2 pr-3">Rola</th><th class="py-2 pr-3">Plán</th>
          <th class="py-2 pr-3">Level</th><th class="py-2 pr-3">XP</th><th class="py-2 pr-3">Progres</th><th class="py-2">Aktivita</th>
        </tr></thead>
        <tbody>${rows.map(r => `
          <tr class="border-b border-zinc-100 dark:border-zinc-800/60 last:border-0">
            <td class="py-2.5 pr-3"><div class="font-semibold text-zinc-900 dark:text-white">${r.full_name || '—'}</div><div class="text-xs text-zinc-500">${r.email}</div></td>
            <td class="py-2.5 pr-3">${r.role === 'admin' ? '🛡️ admin' : 'študent'}</td>
            <td class="py-2.5 pr-3">${r.plan === 'premium' ? '💎 premium' : 'free'}</td>
            <td class="py-2.5 pr-3">${r.prog?.level || '—'}</td>
            <td class="py-2.5 pr-3">${r.prog?.xp ?? 0}</td>
            <td class="py-2.5 pr-3 min-w-[110px]">
              <div class="flex items-center gap-2"><div class="flex-1 h-1.5 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full bg-indigo-500" style="width:${r.prog?.overall || 0}%"></div></div><span class="text-xs font-bold">${r.prog?.overall || 0}%</span></div></td>
            <td class="py-2.5 text-xs text-zinc-500">${r.prog ? new Date(r.prog.updated_at).toLocaleDateString('sk') : 'nezačal'}</td>
          </tr>`).join('')}</tbody>
      </table></div>
      <p class="text-[11px] text-zinc-500 mt-3">💡 Rolu/plán zmeníš v Supabase → Table Editor → profiles (stĺpce role, plan). Platené bloky sa neskôr napoja na stĺpec plan.</p>`;
    if (window.lucide) lucide.createIcons();
  } catch (e) {
    document.getElementById('admin-table').innerHTML = '⚠️ Nepodarilo sa načítať dáta: ' + e.message;
  }
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   LEARNING ENGINE — študentský model, denný plán mentora, quests,
   skill tree a knowledge heatmap
   ───────────────────────────────────────────────────────────────────
   Filozofia: žiadne náhodné úlohy. Všetko sa počíta z reálnych dát
   používateľa: dokončené lekcie, výsledky kvízov, flashcards, streak.
   ═══════════════════════════════════════════════════════════════════ */

/* ── TÉMY pre knowledge map (uzly poznania s priradenými lekciami) ── */
DATA.topics = [
  { id: 't-local-basics', name: 'Lokálne vyhľadávanie', mod: 'gbp', lessons: ['gbp-1-1', 'gbp-1-2'] },
  { id: 't-ranking', name: 'Local Ranking faktory', mod: 'gbp', lessons: ['gbp-1-3', 'gbp-1-4'] },
  { id: 't-profile-setup', name: 'Založenie a verifikácia', mod: 'gbp', lessons: ['gbp-2-1', 'gbp-2-2'] },
  { id: 't-categories', name: 'Kategórie a nastavenia', mod: 'gbp', lessons: ['gbp-2-3', 'gbp-2-4'] },
  { id: 't-content-gbp', name: 'Obsah profilu (foto, produkty)', mod: 'gbp', lessons: ['gbp-2-5', 'gbp-2-6', 'gbp-3-1', 'gbp-3-2'] },
  { id: 't-reviews', name: 'Recenzie', mod: 'gbp', lessons: ['gbp-3-3', 'gbp-3-4'] },
  { id: 't-spam', name: 'Spam fighting', mod: 'gbp', lessons: ['gbp-3-5'] },
  { id: 't-localseo', name: 'Lokálne SEO (NAP, citácie)', mod: 'gbp', lessons: ['gbp-4-1', 'gbp-4-2'] },
  { id: 't-gbp-advanced', name: 'GBP optimalizácia a analytika', mod: 'gbp', lessons: ['gbp-4-3', 'gbp-4-4', 'gbp-5-1'] },
  { id: 't-crawling', name: 'Crawling a indexácia', mod: 'gsc', lessons: ['gsc-1-1', 'gsc-1-2'] },
  { id: 't-sitemap-robots', name: 'Sitemap a robots.txt', mod: 'gsc', lessons: ['gsc-1-3', 'gsc-1-4'] },
  { id: 't-coverage', name: 'Coverage a canonical', mod: 'gsc', lessons: ['gsc-2-1', 'gsc-2-2'] },
  { id: 't-redirects', name: 'Redirecty a 404', mod: 'gsc', lessons: ['gsc-2-3', 'gsc-2-4'] },
  { id: 't-schema', name: 'Structured Data', mod: 'gsc', lessons: ['gsc-2-5'] },
  { id: 't-performance', name: 'Performance a CTR', mod: 'gsc', lessons: ['gsc-3-1', 'gsc-3-2', 'gsc-3-3'] },
  { id: 't-cwv', name: 'Core Web Vitals', mod: 'gsc', lessons: ['gsc-4-1', 'gsc-4-2'] },
  { id: 't-penalties', name: 'Penalizácie a bezpečnosť', mod: 'gsc', lessons: ['gsc-4-3', 'gsc-5-1'] },
  { id: 't-auction', name: 'Aukcia a Ad Rank', mod: 'ads', lessons: ['ads-1-1', 'ads-1-2'] },
  { id: 't-keywords', name: 'Keywords a Match Types', mod: 'ads', lessons: ['ads-2-1', 'ads-2-2', 'ads-2-3'] },
  { id: 't-quality-score', name: 'Quality Score a reklamy', mod: 'ads', lessons: ['ads-2-4', 'ads-2-5', 'ads-2-6'] },
  { id: 't-campaign-types', name: 'Typy kampaní (PMax, Shopping…)', mod: 'ads', lessons: ['ads-1-3', 'ads-3-1', 'ads-3-2', 'ads-3-3', 'ads-3-4', 'ads-3-5', 'ads-3-6'] },
  { id: 't-bidding', name: 'Bidding, CPA, ROAS', mod: 'ads', lessons: ['ads-4-1', 'ads-4-2'] },
  { id: 't-measurement', name: 'Meranie a atribúcia', mod: 'ads', lessons: ['ads-4-3', 'ads-4-4'] },
  { id: 't-audiences', name: 'Publiká a remarketing', mod: 'ads', lessons: ['ads-5-1', 'ads-5-2'] },
  { id: 't-optimization', name: 'Optimalizácia a reporting', mod: 'ads', lessons: ['ads-6-1', 'ads-6-2', 'ads-6-3', 'ads-6-4'] },
];

const Engine = {
  /* ── Mastery témy 0–100 %: 40 % dokončenie lekcií + 60 % kvízy ── */
  mastery(topic) {
    const s = App.state;
    let doneL = 0, quizSum = 0, quizN = 0;
    topic.lessons.forEach(id => {
      if (s.completedLessons[id]) doneL++;
      const q = s.quizResults['lesson:' + id];
      if (q) { quizSum += q.score / q.total; quizN++; }
    });
    const lessonPart = doneL / topic.lessons.length * 40;
    const quizPart = quizN ? (quizSum / quizN) * 60 : 0;
    return Math.round(lessonPart + quizPart);
  },
  /* Stav témy pre knowledge map */
  topicStatus(topic) {
    const m = this.mastery(topic);
    const started = topic.lessons.some(id => App.state.completedLessons[id]);
    if (m >= 85) return { m, key: 'done', label: 'Ovládam', color: '#10b981' };
    if (m >= 60) return { m, key: 'learning', label: 'Učím sa', color: '#3b82f6' };
    if (started || m > 0) return { m, key: 'repeat', label: 'Zopakovať', color: '#f59e0b' };
    return { m, key: 'todo', label: 'Neviem', color: '#71717a' };
  },
  knowledge() { return DATA.topics.map(t => ({ ...t, ...this.topicStatus(t) })); },
  /* Najslabšie témy, v ktorých už používateľ pracoval (má pokusy) */
  weakest(n = 3) {
    return this.knowledge()
      .filter(t => t.m > 0 && t.m < 85)
      .sort((a, b) => a.m - b.m)
      .slice(0, n);
  },

  /* ── DENNÝ PLÁN MENTORA ──────────────────────────────────────────
     Generuje sa raz denne z aktuálneho stavu. Nikdy nie náhodne:
     lekcie = ďalšie nedokončené; kvíz = najslabší modul;
     opakovanie = due flashcards; dôvod = najslabšia téma. */
  dailyPlan() {
    const s = App.state;
    const today = App.todayKey();
    if (s.plan && s.plan.date === today) return s.plan;
    const nextLessons = App.allLessons().filter(l => !s.completedLessons[l.id]).slice(0, 2);
    const weak = this.weakest(1)[0];
    const due = App.fcDueCards().length;
    const weakMod = weak ? weak.mod : (nextLessons[0] ? nextLessons[0].moduleId : 'ads');
    const items = [];
    nextLessons.forEach(l => items.push({ id: 'lesson:' + l.id, type: 'lesson', label: `Lekcia: ${l.title}`, action: `App.go('lesson',{id:'${l.id}'})` }));
    if (due) items.push({ id: 'fc', type: 'fc', label: `${Math.min(due, 8)} flashcards na zopakovanie`, action: `App.go('flashcards')` });
    items.push({ id: 'quiz:' + weakMod, type: 'quiz', label: `10 otázok z modulu ${App.getModule(weakMod).short}`, action: `App.startQuiz('module','${weakMod}')` });
    const proj = DATA.projects.find(p => (App.state.projects[p.id] || {}).status !== 'done');
    if (proj && App.moduleProgress(proj.module) >= 50) items.push({ id: 'proj:' + proj.id, type: 'proj', label: `Praktická úloha: pokrok v projekte „${proj.name}"`, action: `App.go('projects')` });
    const reason = weak
      ? `pretože téma <b>${weak.name}</b> má mastery len ${weak.m} % — posledné testy ukazujú chyby práve tu.`
      : (nextLessons.length ? 'pretože si na začiatku cesty — najdôležitejšia je pravidelnosť.' : 'pretože všetko máš hotové — udržiavaj vedomosti opakovaním.');
    s.plan = { date: today, items, reason, done: {} };
    App.save();
    return s.plan;
  },
  planCheck(itemId) {
    const p = App.state.plan;
    if (!p || p.done[itemId]) return;
    p.done[itemId] = true;
    App.save();
    if (Object.keys(p.done).length === p.items.length) {
      App.state.skillPoints = (App.state.skillPoints || 0) + 3;
      App.addXP(80, '🎯 Denný plán splnený! +3 Skill Points');
      this.questProgress('daily');
    }
    App.render();
  },
  /* Automatické odškrtávanie plánu podľa reálnej aktivity */
  autoTickPlan() {
    const p = App.state.plan;
    if (!p || p.date !== App.todayKey()) return;
    p.items.forEach(it => {
      if (p.done[it.id]) return;
      if (it.type === 'lesson' && App.state.completedLessons[it.id.replace('lesson:', '')]) p.done[it.id] = true;
      if (it.type === 'fc' && App.fcDueCards().length === 0) p.done[it.id] = true;
      if (it.type === 'quiz') {
        const mod = it.id.replace('quiz:', '');
        const t = App.state.testHistory.filter(x => x.id === 'module:' + mod && x.date > new Date(p.date).getTime());
        if (t.length) p.done[it.id] = true;
      }
    });
    App.save();
  },

  /* ── QUESTS: denné / týždenné / mesačné ── */
  weekKey() { const d = new Date(); const on = new Date(d.getFullYear(), 0, 1); return d.getFullYear() + '-w' + Math.ceil((((d - on) / 864e5) + on.getDay() + 1) / 7); },
  monthKey() { return App.todayKey().slice(0, 7); },
  quests() {
    const s = App.state;
    if (!s.quests) s.quests = {};
    const q = s.quests;
    if (!q.weekly || q.weekly.week !== this.weekKey()) q.weekly = { week: this.weekKey(), lessons: 0 };
    if (!q.monthly || q.monthly.month !== this.monthKey()) q.monthly = { month: this.monthKey(), xpStart: s.xp };
    const dailyDone = s.plan && s.plan.date === App.todayKey() && Object.keys(s.plan.done).length >= s.plan.items.length;
    const weeklyTarget = 7, monthlyTarget = 1500;
    return [
      { icon: '☀️', name: 'Daily Quest', desc: 'Splň celý denný plán mentora', prog: dailyDone ? 1 : (s.plan && s.plan.date === App.todayKey() ? Object.keys(s.plan.done).length / s.plan.items.length : 0), reward: '80 XP + 3 SP' },
      { icon: '📅', name: 'Weekly Quest', desc: `Dokonči ${weeklyTarget} lekcií tento týždeň`, prog: Math.min(1, App.lessonsThisWeek() / weeklyTarget), reward: '200 XP + 5 SP' },
      { icon: '🌙', name: 'Monthly Challenge', desc: `Získaj ${monthlyTarget} XP tento mesiac`, prog: Math.min(1, (s.xp - q.monthly.xpStart) / monthlyTarget), reward: 'Odznak + 15 SP' },
    ];
  },
  questProgress(type) {
    const s = App.state;
    if (type === 'weekly-check' && App.lessonsThisWeek() === 7) { s.skillPoints = (s.skillPoints || 0) + 5; App.addXP(200, '📅 Weekly Quest splnený!'); }
    if (type === 'monthly-check' && s.quests?.monthly && (s.xp - s.quests.monthly.xpStart) >= 1500 && !s.quests.monthly.claimed) { s.quests.monthly.claimed = true; s.skillPoints = (s.skillPoints || 0) + 15; App.toast('🌙 Monthly Challenge splnený!', '+15 Skill Points', ''); }
    App.save();
  },

  /* ── PREDIKCIE ── */
  clientReadiness() {
    // pripravenosť na reálneho klienta: progres + testy + prax (roleplay, projekty)
    const prog = App.overallProgress();
    const tests = App.state.testHistory.filter(t => t.type !== 'lesson');
    const testAvg = tests.length ? tests.reduce((a, t) => a + t.score / t.total, 0) / tests.length * 100 : 0;
    const practice = Math.min(100, ((App.state.roleplaysDone || 0) * 10) + (Object.values(App.state.projects).filter(p => p.status === 'done').length * 15));
    return Math.round(prog * 0.4 + testAvg * 0.35 + practice * 0.25);
  },
};

/* ═══════════════ VIEW: SKILL TREE ═══════════════ */
Views.skilltree = function () {
  /* Uzol = sekcia modulu. Odomyká sa: prvá sekcia vždy; ďalšia keď
     predchádzajúca ≥ 60 %. Master vetva po dokončení všetkých modulov. */
  const sectionPct = (sec) => {
    const done = sec.lessons.filter(l => App.state.completedLessons[l.id]).length;
    return Math.round(done / sec.lessons.length * 100);
  };
  const treeHtml = DATA.modules.map(m => {
    let prevPct = 100;
    const nodes = m.sections.map((sec, i) => {
      const pct = sectionPct(sec);
      const unlocked = i === 0 || prevPct >= 60;
      const state = !unlocked ? 'locked' : pct >= 100 ? 'done' : pct > 0 ? 'progress' : 'open';
      const node = { sec, pct, unlocked, state };
      prevPct = pct;
      return node;
    });
    return `
    <div class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316] p-5">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${m.color}18;color:${m.color}"><i data-lucide="${m.icon}" class="w-5 h-5"></i></div>
        <div><div class="font-bold text-zinc-900 dark:text-white">${m.name}</div><div class="text-xs text-zinc-500">${App.moduleProgress(m.id)} % · vetva stromu</div></div>
      </div>
      <div class="relative pl-5">
        <div class="absolute left-[9px] top-2 bottom-2 w-0.5 bg-zinc-200 dark:bg-zinc-800"></div>
        ${nodes.map(n => `
        <div class="relative mb-3 last:mb-0">
          <div class="absolute -left-5 top-2.5 w-[18px] h-[18px] rounded-full border-2 flex items-center justify-center text-[9px] font-bold
            ${n.state === 'done' ? 'bg-emerald-500 border-emerald-500 text-white' : n.state === 'progress' ? 'border-indigo-500 text-indigo-400 bg-white dark:bg-[#131316]' : n.state === 'open' ? 'border-zinc-400 bg-white dark:bg-[#131316]' : 'border-zinc-300 dark:border-zinc-700 bg-zinc-100 dark:bg-zinc-800'}">
            ${n.state === 'done' ? '✓' : n.state === 'locked' ? '🔒' : ''}
          </div>
          <button ${n.unlocked ? `onclick="App.go('module',{id:'${m.id}'})"` : 'disabled'}
            class="w-full text-left rounded-xl border px-3 py-2 transition ${n.unlocked ? 'border-zinc-200 dark:border-zinc-800 hover:border-indigo-500/50 btn-press' : 'border-zinc-100 dark:border-zinc-800/50 opacity-45 cursor-not-allowed'}">
            <div class="flex items-center justify-between">
              <span class="text-sm font-semibold ${n.state === 'done' ? 'text-emerald-500' : 'text-zinc-800 dark:text-zinc-200'}">${n.sec.title}</span>
              <span class="text-xs font-bold" style="color:${n.state === 'done' ? '#10b981' : m.color}">${n.unlocked ? n.pct + ' %' : ''}</span>
            </div>
            ${n.unlocked ? `<div class="mt-1.5 h-1 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full" style="background:${m.color};width:${n.pct}%"></div></div>` : '<div class="text-[10px] text-zinc-500 mt-0.5">Odomkne sa: predchádzajúca sekcia ≥ 60 %</div>'}
          </button>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  const allDone = DATA.modules.every(m => App.moduleProgress(m.id) >= 100);
  return `
  <p class="text-sm text-zinc-500 mb-4">🌳 Strom znalostí — uzly sa odomykajú postupne. Master vetva (Agentúra) sa otvorí po dokončení všetkých troch modulov.</p>
  <div class="grid md:grid-cols-3 gap-4">${treeHtml}</div>
  <div class="mt-4 rounded-2xl border-2 ${allDone ? 'border-violet-500/50 bg-violet-500/5' : 'border-dashed border-zinc-300 dark:border-zinc-700'} p-5 text-center">
    <div class="text-3xl mb-1">${allDone ? '👑' : '🔒'}</div>
    <div class="font-bold text-zinc-900 dark:text-white">MASTER MODE — Agentúra</div>
    <p class="text-xs text-zinc-500 mt-1">${allDone ? 'Odomknuté! 20 komplexných klientskych projektov s reálnymi udalosťami.' : 'Dokonči všetky tri moduly a odomkni simuláciu vlastnej agentúry s 20 projektmi.'}</p>
    <button onclick="App.go('agency')" class="btn-press mt-3 px-5 py-2 rounded-xl text-sm font-semibold ${allDone ? 'bg-violet-600 hover:bg-violet-500 text-white' : 'border border-zinc-300 dark:border-zinc-700'}">${allDone ? 'Vstúpiť do Agentúry' : 'Pozrieť klientov (roleplay je dostupný hneď)'}</button>
  </div>`;
};

/* ═══════════════ Heatmap + Knowledge map (pre Štatistiky) ═══════════════ */
Views.heatmapHTML = function () {
  const know = Engine.knowledge();
  const counts = { done: 0, learning: 0, repeat: 0, todo: 0 };
  know.forEach(k => counts[k.key]++);
  const heat = (m) => m >= 85 ? '#10b981' : m >= 60 ? '#22c55e' : m >= 40 ? '#f59e0b' : m > 0 ? '#ef4444' : (App.state.theme === 'dark' ? '#27272a' : '#e4e4e7');
  return `
  <div class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316] p-5 mt-4">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <h3 class="font-bold text-sm text-zinc-900 dark:text-white">🗺️ Knowledge Map — heatmapa znalostí</h3>
      <div class="flex gap-3 text-[11px] text-zinc-500">
        <span>🟢 Ovládam (${counts.done})</span><span>🔵 Učím sa (${counts.learning})</span>
        <span>🟠 Zopakovať (${counts.repeat})</span><span>⚪ Neviem (${counts.todo})</span>
      </div>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
      ${know.map(k => `
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 p-3" title="${k.label}">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-semibold text-zinc-800 dark:text-zinc-200 truncate pr-2">${k.name}</span>
          <span class="text-xs font-extrabold shrink-0" style="color:${heat(k.m)}">${k.m} %</span>
        </div>
        <div class="h-2 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full transition-all duration-700" style="background:${heat(k.m)};width:${Math.max(2, k.m)}%"></div></div>
        <div class="text-[10px] mt-1" style="color:${k.color}">${k.label} · ${App.getModule(k.mod).short}</div>
      </div>`).join('')}
    </div>
    <div class="mt-4 grid sm:grid-cols-2 gap-3">
      <div class="rounded-xl bg-indigo-500/10 border border-indigo-500/20 p-3 text-xs">
        <b class="text-indigo-400">🎯 Predikcia certifikácie (Search):</b>
        <span class="text-zinc-700 dark:text-zinc-300">${App.certReadiness(DATA.certs[0])} % pravdepodobnosť úspechu</span>
      </div>
      <div class="rounded-xl bg-emerald-500/10 border border-emerald-500/20 p-3 text-xs">
        <b class="text-emerald-500">🤝 Pripravenosť na klienta:</b>
        <span class="text-zinc-700 dark:text-zinc-300">${Engine.clientReadiness()} % (progres + testy + prax)</span>
      </div>
    </div>
  </div>`;
};

/* ═══════════════ Denný plán + Quests karta (pre Dashboard) ═══════════════ */
Views.dailyPlanCard = function () {
  Engine.autoTickPlan();
  const plan = Engine.dailyPlan();
  const doneN = Object.keys(plan.done).length;
  const quests = Engine.quests();
  return `
  <div class="grid md:grid-cols-3 gap-4 mt-2">
    <div class="md:col-span-2 rounded-2xl border-2 border-indigo-500/30 bg-indigo-500/5 p-5">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-lg">🤖</span><h3 class="font-bold text-zinc-900 dark:text-white">Mentor: dnešný plán</h3>
        <span class="ml-auto text-xs font-bold text-indigo-400">${doneN}/${plan.items.length}</span>
      </div>
      <p class="text-xs text-zinc-500 mb-3">Odporúčam presne toto — ${plan.reason}</p>
      <div class="space-y-1.5">
        ${plan.items.map(it => `
        <div class="flex items-center gap-2.5 rounded-xl px-3 py-2 ${plan.done[it.id] ? 'bg-emerald-500/10' : 'bg-white dark:bg-[#131316] border border-zinc-200 dark:border-zinc-800'}">

<script>

const Auditor = {

    'canonical': { name: 'Opraviť canonical', sev: 'high', impact: 4, effort: 1, time: '1–2 hodiny', benefit: 'Čistá kanonizácia = žiadne rozdrobené signály', how: 'Self-referencing canonical, absolútna URL, súlad so sitemap.' },
    'viewport': { name: 'Doplniť viewport meta tag', sev: 'critical', impact: 5, effort: 1, time: '15 minút', benefit: 'Bez neho web nie je mobilný — mobile-first indexing!', how: '<meta name="viewport" content="width=device-width, initial-scale=1">.' },
    'is-on-https': { name: 'Prejsť na HTTPS', sev: 'critical', impact: 5, effort: 2, time: '0,5 dňa', benefit: 'Bezpečnosť, dôvera, ranking signál', how: 'SSL certifikát (Let\'s Encrypt zdarma) + 301 z HTTP + oprava mixed content.' },

  /* Sanitizácia používateľských vstupov pred uložením/renderovaním
     (ochrana pred HTML injection v histórii auditov a reportoch) */
  clean(s) { return String(s || '').replace(/[<>"'`]/g, '').slice(0, 200); },

  /* ── WEB AUDIT cez PageSpeed Insights API ── */
  async runWebAudit(url) {
    url = this.clean(url);
    const api = 'https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=' + encodeURIComponent(url) + '&strategy=mobile&category=PERFORMANCE&category=SEO&locale=sk';
    const resp = await fetch(api);
    if (!resp.ok) throw new Error('PSI API vrátilo ' + resp.status + ' — skontroluj URL (musí byť verejne dostupná).');
    const d = await resp.json();
    const lh = d.lighthouseResult;
    if (!lh) throw new Error('Lighthouse analýza zlyhala — web môže blokovať roboty.');
    const perf = Math.round((lh.categories.performance?.score || 0) * 100);
    const seo = Math.round((lh.categories.seo?.score || 0) * 100);
    // Field data (CrUX) ak existujú
    const crux = d.loadingExperience?.metrics || {};
    const cwv = {
      lcp: crux.LARGEST_CONTENTFUL_PAINT_MS ? (crux.LARGEST_CONTENTFUL_PAINT_MS.percentile / 1000).toFixed(1) + ' s (' + this.cat(crux.LARGEST_CONTENTFUL_PAINT_MS.category) + ')' : (lh.audits['largest-contentful-paint']?.displayValue || '—') + ' (lab)',
      cls: crux.CUMULATIVE_LAYOUT_SHIFT_SCORE ? (crux.CUMULATIVE_LAYOUT_SHIFT_SCORE.percentile / 100).toFixed(2) + ' (' + this.cat(crux.CUMULATIVE_LAYOUT_SHIFT_SCORE.category) + ')' : (lh.audits['cumulative-layout-shift']?.displayValue || '—') + ' (lab)',
      inp: crux.INTERACTION_TO_NEXT_PAINT ? crux.INTERACTION_TO_NEXT_PAINT.percentile + ' ms (' + this.cat(crux.INTERACTION_TO_NEXT_PAINT.category) + ')' : 'nedostatok field dát',
    };
    // Zozbieraj neúspešné audity, na ktoré máme odporúčania
    const recs = [];
    Object.entries(this.webRecs).forEach(([id, rec]) => {
      const a = lh.audits[id];
      if (a && a.score !== null && a.score < 0.9) recs.push({ ...rec, detail: a.displayValue || '' });
    });
    const sevRank = { critical: 0, high: 1, med: 2, low: 3 };
    recs.sort((a, b) => sevRank[a.sev] - sevRank[b.sev] || b.impact - a.impact);
    const overall = Math.round(perf * 0.45 + seo * 0.4 + (recs.filter(r => r.sev === 'critical').length ? 0 : 15));
    const audit = {
      type: 'web', url, date: Date.now(),
      overall: Math.min(100, overall), perf, seo, cwv, recs,
      quickWins: recs.filter(r => r.effort <= 2).slice(0, 5),
      longTerm: recs.filter(r => r.effort >= 3),
      adsReady: seo >= 70 && perf >= 40 ? 'Web je použiteľný ako landing page pre kampane.' : 'Pred spustením kampaní odporúčame opraviť kritické nálezy — landing page kvalita ovplyvňuje Quality Score aj konverzie.',
    };
    App.state.audits.unshift(audit);
    App.state.audits = App.state.audits.slice(0, 20);
    App.save();
    App.addXP(50, 'AI Audit webu');
    return audit;
  },

    { id: 'citations', q: 'Je firma v hlavných katalógoch (Zoznam, Azet, Bing, Apple Maps)?', w: 3, cat: 'Web', rec: { name: 'Vybudovať základné citácie', sev: 'low', impact: 2, effort: 2, time: '0,5 dňa', benefit: 'Prominence + konzistencia dát', how: '10–20 kvalitných katalógov s master NAP.' } },

  runGbpAudit(answers, bizName) {
    bizName = this.clean(bizName);
    let score = 0, totalW = 0;
    const recs = [];
    this.gbpQuestions.forEach(q => {
      totalW += q.w;
      const a = answers[q.id]; // 1 = áno, 0.5 = čiastočne, 0 = nie
      score += q.w * (a ?? 0);
      if ((a ?? 0) < 1) recs.push({ ...q.rec, partial: a === 0.5 });
    });
    const sevRank = { critical: 0, high: 1, med: 2, low: 3 };
    recs.sort((a, b) => sevRank[a.sev] - sevRank[b.sev] || b.impact - a.impact);
    const overall = Math.round(score / totalW * 100);
    const audit = {
      type: 'gbp', url: bizName, date: Date.now(), overall,
      cats: ['Základ', 'Relevancia', 'Obsah', 'Recenzie', 'Web', 'Konkurencia'].map(c => {
        const qs = this.gbpQuestions.filter(q => q.cat === c);
        const s = qs.reduce((a, q) => a + q.w * (answers[q.id] ?? 0), 0);
        const t = qs.reduce((a, q) => a + q.w, 0);
        return { name: c, pct: Math.round(s / t * 100) };
      }),
      recs,
      quickWins: recs.filter(r => r.effort <= 1).slice(0, 5),
      longTerm: recs.filter(r => r.effort >= 2),
    };
    App.state.audits.unshift(audit);
    App.state.audits = App.state.audits.slice(0, 20);
    App.save();
    App.addXP(60, 'GBP Audit dokončený');
    return audit;
  },

Views.startWebAudit = async function () {
  const url = document.getElementById('audit-url').value.trim();
  if (!url.startsWith('http')) { document.getElementById('audit-status').innerHTML = '⚠️ Zadaj celú URL vrátane https://'; return; }
  const btn = document.getElementById('audit-btn');
  btn.disabled = true; btn.textContent = 'Analyzujem…';
  document.getElementById('audit-status').innerHTML = '⏳ Google Lighthouse analyzuje web (20–40 s)…';
  try {
    await Auditor.runWebAudit(url);
    App.render();
    this.showAudit(0);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Auditovať';
    document.getElementById('audit-status').innerHTML = '❌ ' + e.message;
  }
};

Views.startGbpAudit = function (answers = {}, step = -1) {
  const qs = Auditor.gbpQuestions;
  if (step === -1) {
    App.modal(`
      <h3 class="font-bold text-lg text-zinc-900 dark:text-white mb-2">📍 GBP Audit</h3>
      <p class="text-sm text-zinc-500 mb-4">Otvor si profil firmy na Google Maps (a jej web) a odpovedz na ${qs.length} otázok. Na konci dostaneš skóre, akčný plán a report pre klienta.</p>

      <input id="gbp-name" placeholder="napr. Pizzeria Bella Nitra" class="w-full mt-1 mb-4 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2.5 text-sm outline-none focus:border-indigo-500">
      <button onclick="Views.startGbpAudit({}, 0)" class="btn-press w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold">Začať audit</button>`);
    return;
  }
  if (step === 0) Views._gbpName = document.getElementById('gbp-name')?.value.trim() || 'GBP profil';
  if (step >= qs.length) {
    const audit = Auditor.runGbpAudit(answers, Views._gbpName);

  }

  App.modal(`
    <div class="text-xs text-zinc-500 mb-2">Otázka ${step + 1}/${qs.length} · ${q.cat}</div>
    ${Views.progressBar((step + 1) / qs.length * 100, 'from-emerald-500 to-teal-400', 'h-1.5')}

};

/* ═══════════════ ROLEPLAY ENGINE v2 ═══════════════ */
const Roleplay = {
  session: null, // { client, round, mood, scores:{comm,arg,expert,prof}, log }

  start(clientId) {
    const c = DATA.clients.find(x => x.id === clientId);
    this.session = { client: c, round: 1, mood: c.personality === 'skeptical' || c.personality === 'impatient' ? 'wary' : 'neutral', scores: { comm: 0, arg: 0, expert: 0, prof: 0 }, maxRounds: 3 };
    const moodTxt = { friendly: 'priateľsky', skeptical: 'skepticky', impatient: 'netrpezlivo', analytical: 'vecne', chaotic: 'chaoticky' }[c.personality];
    this.renderChat(`<b>${c.person}</b> (${c.name}, ${c.industry}) pôsobí ${moodTxt}:<br><br><i>„${this.intro(c)}"</i>`);
  },
  intro(c) {
    const probs = c.problems.map(p => DATA.problemLib[p].txt).join(' a ');
    const openers = {
      friendly: `Dobrý deň! Odporučili nám vás. Máme ${c.industry.toLowerCase()} v ${c.city} a trápi nás, že ${probs}. Cieľ? ${c.goal}. Rozpočet vieme dať okolo ${c.budget} € mesačne. Čo na to hovoríte?`,
      skeptical: `Dobrý deň. Poviem otvorene — marketérom moc neverím. ${c.history} Ale fakt je, že ${probs}. Ak by ste ma vedeli presvedčiť... cieľ je ${c.goal.toLowerCase()}. Prečo by som mal veriť práve vám?`,
      impatient: `Dobrý deň, poďme rovno k veci, nemám veľa času. ${c.industry}, ${c.city}, problém: ${probs}. Potrebujem ${c.goal.toLowerCase()} — a rýchlo. Koľko a za aký čas?`,
      analytical: `Dobrý deň. Pripravil som si podklady: ${c.history} Identifikovali sme, že ${probs}. KPI: ${c.goal.toLowerCase()}, mesačný rozpočet ${c.budget} €. Zaujíma ma váš konkrétny postup a metriky.`,
      chaotic: `Jéj, dobrý deň! Tak ja ani neviem kde začať... ${c.history} No a vraj ${probs}? Alebo to bolo niečo iné... Každopádne chceme ${c.goal.toLowerCase()}. Pomôžete? Čo máme robiť?`,
    };
    return openers[c.personality];
  },
  evaluate(text) {
    const t = text.toLowerCase();
    const c = this.session.client;
    // odbornosť: trafené témy z problémov klienta
    const allKw = c.problems.flatMap(p => DATA.problemLib[p].kw);
    const expertHits = allKw.filter(k => t.includes(k)).length;
    // argumentácia: čísla, dáta, proces, prečo
    const argHits = ['dát', 'čísl', 'merat', 'krok', 'najprv', 'preto', 'napríklad', 'audit', '%', '€'].filter(k => t.includes(k)).length;
    // komunikácia: dĺžka primeraná, otázky na klienta, oslovenie
    const commHits = (t.length > 80 ? 1 : 0) + (t.includes('?') ? 1 : 0) + (['rozumiem', 'chápem', 'dobrá otázka', 'súhlas'].some(k => t.includes(k)) ? 1 : 0);
    // profesionalita: bez prehnaných sľubov
    const badPromise = ['garantujem', 'zaručujem', 'prvé miesto', 'do týždňa', '100 %'].some(k => t.includes(k));
    const profScore = badPromise ? 0 : (['realis', 'očakáv', 'týždn', 'mesiac', 'postupne'].some(k => t.includes(k)) ? 2 : 1);
    const s = this.session.scores;
    s.expert += Math.min(2, expertHits);
    s.arg += Math.min(2, argHits >= 2 ? 2 : argHits);
    s.comm += Math.min(2, commHits);
    s.prof += profScore;
    /* Rubrika: zaznamenaj dôvody odpočtov (kalibrované hodnotenie) */
    if (!this.session.deductions) this.session.deductions = [];
    const round = this.session.round;
    if (expertHits === 0) this.session.deductions.push(`Kolo ${round}: −2 Odbornosť — odpoveď nereagovala na konkrétne problémy klienta (${c.problems.map(p => DATA.problemLib[p].txt).join(', ')})`);
    if (argHits < 2) this.session.deductions.push(`Kolo ${round}: −${2 - Math.min(2, argHits)} Argumentácia — chýbali dáta, čísla alebo konkrétny postup krokov`);
    if (commHits < 2) this.session.deductions.push(`Kolo ${round}: −${2 - Math.min(2, commHits)} Komunikácia — ${!t.includes('?') ? 'žiadna otázka na klienta' : 'príliš stručná odpoveď'}`);
    if (badPromise) this.session.deductions.push(`Kolo ${round}: −2 Profesionalita — ZAKÁZANÉ TVRDENIE (garancia/prvé miesto/nereálny termín)`);
    else if (profScore < 2) this.session.deductions.push(`Kolo ${round}: −1 Profesionalita — chýbalo nastavenie realistických očakávaní`);
    // nálada klienta
    const roundScore = Math.min(2, expertHits) + profScore;
    if (badPromise) this.session.mood = 'angry';
    else if (roundScore >= 3) this.session.mood = 'happy';
    else if (roundScore <= 1) this.session.mood = this.session.mood === 'wary' ? 'angry' : 'wary';
    return { expertHits, badPromise, roundScore };
  },
  reply(evalR) {
    const c = this.session.client;
    const advice = c.problems.map(p => DATA.problemLib[p].advice)[this.session.round - 2] || DATA.problemLib[c.problems[0]].advice;
    if (evalR.badPromise) return `„Moment — ${['garancie', 'prvé miesto', 'do týždňa'].find(x => true)}? To mi sľuboval aj minulý dodávateľ a dopadlo to zle. Teraz vám verím menej. Skúste znova — bez zázrakov."`;
    if (this.session.mood === 'happy') {
      const replies = [
        `„Dobre, to znie rozumne. A čo konkrétne by ste riešili ako prvé — a dokedy uvidím prvé čísla?"`,
        `„Páči sa mi ten prístup. Posledná vec: rozpočet ${c.budget} € — stačí to vôbec? A ako budeme merať, či to funguje?"`,
      ];
      return replies[this.session.round - 2] || replies[0];
    }
    if (this.session.mood === 'angry') return `„Úprimne? Nepresvedčili ste ma. Hovoríte všeobecne. Náš problém je ${DATA.problemLib[c.problems[0]].txt} — počul som, že sa to rieši cez ${advice}. Viete o tom niečo?"`;
    const nextProb = c.problems[Math.min(this.session.round - 1, c.problems.length - 1)];
    return `„Hm, čiastočne rozumiem, ale stále mi nie je jasný postup. Konkrétne — čo spravíte s tým, že ${DATA.problemLib[nextProb].txt}?"`;
  },
  finish() {
    const s = this.session.scores;
    const max = this.session.maxRounds * 2;
    const pct = k => Math.round(Math.min(100, s[k] / max * 100));
    const total = Math.round((pct('comm') + pct('arg') + pct('expert') + pct('prof')) / 4);
    App.state.roleplaysDone = (App.state.roleplaysDone || 0) + 1;
    App.save();
    App.addXP(30 + Math.round(total / 2), 'Roleplay s klientom');
    const grade = total >= 80 ? '🏆 Výborné — klient by podpísal zmluvu.' : total >= 55 ? '👍 Solídne — klient si vyžiada ešte jedno stretnutie.' : '📚 Klient sa „ozve neskôr". Pozri si tipy nižšie a skús iného klienta.';
    const c = this.session.client;
    const html = `
      <div class="text-center mb-3"><div class="text-4xl">${total >= 80 ? '🏆' : total >= 55 ? '🤝' : '📚'}</div>
      <div class="font-bold text-lg text-zinc-900 dark:text-white">Hodnotenie: ${total} %</div>
      <div class="text-sm text-zinc-500">${grade}</div></div>
      ${[['💬 Komunikácia', 'comm'], ['📊 Argumentácia', 'arg'], ['🎓 Odbornosť', 'expert'], ['🤵 Profesionalita', 'prof']].map(([n, k]) => `
        <div class="flex items-center gap-2 text-sm mb-1.5"><span class="w-36">${n}</span>
        <div class="flex-1 h-2 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full ${pct(k) >= 60 ? 'bg-emerald-500' : 'bg-amber-500'}" style="width:${pct(k)}%"></div></div>
        <b class="w-10 text-right text-xs">${pct(k)} %</b></div>`).join('')}
      ${this.session.deductions && this.session.deductions.length ? `
      <div class="mt-3 rounded-xl bg-amber-500/10 border border-amber-500/20 p-3 text-xs text-zinc-700 dark:text-zinc-300">
        <b class="text-amber-500">📋 Rubrika — dôvody odpočtov:</b>
        <ul class="mt-1 space-y-0.5">${this.session.deductions.slice(0, 8).map(d => `<li>• ${d}</li>`).join('')}</ul>
      </div>` : ''}
      <div class="mt-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 p-3 text-xs text-zinc-700 dark:text-zinc-300">
        <b class="text-indigo-400">Referenčné riešenie (čo klient potreboval počuť):</b> ${c.problems.map(p => DATA.problemLib[p].advice).join(' · ')}
      </div>`;
    this.session = null;
    return html;
  },
  renderChat(clientHtml, feedback) {
    const s = this.session;
    const moodEmoji = { neutral: '😐', wary: '🤨', happy: '🙂', angry: '😠' };
    App.modal(`
      <div class="flex items-center justify-between mb-3">
        <div><h3 class="font-bold text-zinc-900 dark:text-white">${s ? s.client.name : 'Roleplay'}</h3>
        ${s ? `<div class="text-xs text-zinc-500">Kolo ${s.round}/${s.maxRounds} · nálada klienta: ${moodEmoji[s.mood]} · rozpočet ${s.client.budget} €/mes.</div>` : ''}</div>
        <button onclick="Roleplay.session=null;App.closeModal()" class="text-zinc-400 hover:text-red-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      ${feedback ? `<div class="mb-3 text-xs rounded-xl bg-zinc-100 dark:bg-zinc-800/70 p-3">${feedback}</div>` : ''}
      <div class="rounded-2xl bg-zinc-100 dark:bg-zinc-800/70 p-4 text-sm text-zinc-800 dark:text-zinc-200 mb-4">${clientHtml}</div>
      ${s ? `
      <textarea id="rp-input" rows="4" placeholder="Tvoja odpoveď klientovi… (píš ako skutočnému klientovi — konkrétne kroky, dáta, realistické očakávania)"
        class="w-full rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent p-3 text-sm outline-none focus:border-indigo-500 mb-3"></textarea>
      <button onclick="Roleplay.send()" class="btn-press w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Odpovedať klientovi</button>`
      : `<button onclick="App.closeModal();App.render()" class="btn-press w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Zavrieť</button>`}
    `, true);
    if (window.lucide) lucide.createIcons();
  },
  send() {
    const text = document.getElementById('rp-input').value.trim();
    if (text.length < 20) { App.toast('✍️ Napíš plnohodnotnú odpoveď', 'aspoň pár viet', ''); return; }
    const ev = this.evaluate(text);
    const fb = ev.badPromise
      ? '🔴 <b>Pozor:</b> nereálne sľuby (garancie, prvé miesto…) sú červená vlajka — profesionál ich nikdy nedáva.'
      : ev.roundScore >= 3 ? '🟢 <b>Dobrá odpoveď:</b> trafil si témy klienta a držíš realistické očakávania.'
      : ev.expertHits === 0 ? '🟠 <b>Príliš všeobecné:</b> odpoveď sa dala povedať hocikomu — klient potrebuje počuť riešenie svojho problému.'
      : '🟡 <b>Čiastočne:</b> smer dobrý, pridaj konkrétny postup a dáta.';
    this.session.round++;
    if (this.session.round > this.session.maxRounds) {
      this.renderChat(this.finish(), fb);
    } else {
      this.renderChat(`<i>${this.reply(ev)}</i>`, fb);
    }
  },
};

/* ═══════════════ MASTER MODE ENGINE ═══════════════ */
const Master = {
  unlocked() { return DATA.modules.every(m => App.moduleProgress(m.id) >= 100); },
  stateFor(cid) {
    if (!App.state.master[cid]) App.state.master[cid] = { step: 0, score: 0, events: App.sample(DATA.masterEvents, 5).map(e => DATA.masterEvents.indexOf(e)), done: false, log: [] };
    return App.state.master[cid];
  },
  open(cid) {
    const c = DATA.clients.find(x => x.id === cid);
    const st = this.stateFor(cid);
    if (st.done) { this.finalReport(cid); return; }
    if (st.step === 0) {
      App.modal(`
        <h3 class="font-bold text-lg text-zinc-900 dark:text-white mb-1">👑 Master projekt: ${c.name}</h3>
        <p class="text-xs text-zinc-500 mb-3">${c.industry} · ${c.city} · rozpočet ${c.budget} €/mes. · konkurencia: ${c.competition}</p>
        <div class="rounded-xl bg-zinc-100 dark:bg-zinc-800/70 p-3 text-sm mb-3">
          <b>Brief:</b> ${c.history} Problémy: ${c.problems.map(p => DATA.problemLib[p].txt).join(', ')}. Cieľ: ${c.goal}.
          Stav webu: ${{ ok: 'v poriadku', bad: 'zastaraný', none: 'žiadny' }[c.web]} · GBP: ${{ none: 'neexistuje', unclaimed: 'neprevzatý', weak: 'slabý', good: 'dobrý' }[c.gbp]}.
        </div>
        <p class="text-sm text-zinc-600 dark:text-zinc-400 mb-4">Spravuješ tohto klienta 5 „týždňov". Každý týždeň príde reálna udalosť a tvoja reakcia rozhodne o výsledku spolupráce.</p>
        <button onclick="App.closeModal();Master.nextEvent('${cid}')" class="btn-press w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold">Začať týždeň 1 →</button>`, true);
      st.step = 1; App.save();
      return;
    }
    this.nextEvent(cid);
  },
  nextEvent(cid) {
    const st = this.stateFor(cid);
    if (st.step > 5) { st.done = true; App.save(); this.finalReport(cid); return; }
    const ev = DATA.masterEvents[st.events[st.step - 1]];
    const shuffled = App.sample(ev.opts.map((o, i) => ({ o, i })), ev.opts.length);
    App.modal(`
      <div class="text-xs text-zinc-500 mb-2">Týždeň ${st.step}/5 · skóre ${st.score}/${(st.step - 1) * 2}</div>
      ${Views.progressBar(st.step / 5 * 100, 'from-violet-500 to-fuchsia-500', 'h-1.5')}
      <h3 class="font-bold text-zinc-900 dark:text-white my-4">${ev.txt}</h3>
      <div class="space-y-2">
        ${shuffled.map(({ o, i }) => `
        <button onclick="Master.choose('${cid}',${st.events[st.step - 1]},${i})" class="btn-press w-full text-left px-4 py-3 rounded-xl border border-zinc-200 dark:border-zinc-700 hover:border-violet-500 text-sm transition">${o[0]}</button>`).join('')}
      </div>`, true);
  },
  choose(cid, evIdx, optIdx) {
    const st = this.stateFor(cid);
    const opt = DATA.masterEvents[evIdx].opts[optIdx];
    st.score += opt[1];
    st.log.push({ ev: evIdx, opt: optIdx, pts: opt[1] });
    st.step++;
    App.save();
    App.modal(`
      <div class="text-center mb-3 text-3xl">${opt[1] === 2 ? '✅' : opt[1] === 1 ? '🟡' : '❌'}</div>
      <div class="font-bold text-center text-zinc-900 dark:text-white mb-2">${opt[1] === 2 ? 'Výborná reakcia! (+2)' : opt[1] === 1 ? 'Čiastočne správne (+1)' : 'Zlá reakcia (0)'}</div>
      <p class="text-sm text-zinc-600 dark:text-zinc-400 rounded-xl bg-zinc-100 dark:bg-zinc-800/70 p-3 mb-4">${opt[2]}</p>
      <button onclick="App.closeModal();Master.nextEvent('${cid}')" class="btn-press w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold">${st.step > 5 ? 'Záverečné hodnotenie →' : 'Pokračovať na týždeň ' + st.step + ' →'}</button>`, true);
  },
  finalReport(cid) {
    const c = DATA.clients.find(x => x.id === cid);
    const st = this.stateFor(cid);
    const pct = Math.round(st.score / 10 * 100);
    const grade = pct >= 85 ? ['A', '#10b981', 'Klient predlžuje zmluvu a odporúča ťa ďalej. Toto je senior výkon.'] : pct >= 65 ? ['B', '#3b82f6', 'Spolupráca pokračuje — pár rozhodnutí by senior spravil inak.'] : pct >= 45 ? ['C', '#f59e0b', 'Klient zostáva, ale dôvera je naštrbená. Pozri si vysvetlenia udalostí.'] : ['D', '#ef4444', 'Klient odchádza. Prejdi si teóriu k udalostiam a skús projekt znova.'];
    if (!st.rewarded) { st.rewarded = true; App.save(); App.addXP(100 + st.score * 15, `Master projekt: ${c.name}`); }
    App.modal(`
      <div class="text-center mb-4">
        <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-3xl font-extrabold text-white mb-2" style="background:${grade[1]}">${grade[0]}</div>
        <h3 class="font-bold text-lg text-zinc-900 dark:text-white">${c.name} — záverečné hodnotenie</h3>
        <div class="text-sm text-zinc-500">${st.score}/10 bodov (${pct} %)</div>
        <p class="text-sm text-zinc-600 dark:text-zinc-400 mt-2">${grade[2]}</p>
      </div>
      <div class="space-y-1.5 mb-4 text-xs">
        ${st.log.map(l => { const e = DATA.masterEvents[l.ev]; return `<div class="rounded-xl border border-zinc-200 dark:border-zinc-800 p-2.5">
          <div class="flex gap-2"><span>${l.pts === 2 ? '✅' : l.pts === 1 ? '🟡' : '❌'}</span><span class="flex-1 text-zinc-700 dark:text-zinc-300">${e.txt}</span></div>
        </div>`; }).join('')}
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="delete App.state.master['${cid}'];App.save();App.closeModal();Master.open('${cid}')" class="btn-press py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 text-sm font-semibold">↻ Skúsiť znova</button>
        <button onclick="App.closeModal();App.render()" class="btn-press py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white text-sm font-semibold">Zavrieť</button>
      </div>`, true);
  },
};
