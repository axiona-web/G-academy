<script>
/* ═══════════════════════════════════════════════════════════════════
   APP CORE — stav, localStorage, router, gamifikácia, časomiera
   Architektúra: App (jadro) + Views (obrazovky, samostatný súbor)
   ═══════════════════════════════════════════════════════════════════ */

const App = {
  /* ── Predvolený stav (ukladá sa do localStorage) ── */
  defaultState() {
    return {
      xp: 0,
      completedLessons: {},        // { lessonId: timestamp }
      checklistState: {},          // { lessonId: [bool,...] }
      quizResults: {},             // { quizId: {score,total,date} } — najlepší výsledok
      testHistory: [],             // [{type:'lesson'|'module'|'final'|'cert', id, score, total, date}]
      flashcards: {},              // { cardId: {due, interval, ease, reps} }
      fcReviews: 0,
      certs: {},                   // { certId: {done, date} }
      projects: {},                // { projId: {status:'todo'|'progress'|'done', notes, checks:[], rating} }
      streak: { last: null, count: 0 },
      dailyGoalMin: 30,
      weeklyGoalLessons: 5,
      timeLog: {},                 // { 'YYYY-MM-DD': minutes }
      achievements: {},            // { achId: timestamp }
      theme: 'dark',
      apiKey: '', apiProvider: 'anthropic',
      mentorHistory: [],
    };
  },

  state: null,
  KEY: 'gacademy_v1',

  /* ── Perzistencia ── */
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.state = raw ? Object.assign(this.defaultState(), JSON.parse(raw)) : this.defaultState();
    } catch (e) { this.state = this.defaultState(); }
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); } catch (e) {} },

  /* ── Pomocníci na dáta kurzu ── */
  allLessons() {
    if (this._all) return this._all;
    this._all = [];
    DATA.modules.forEach(m => m.sections.forEach(sec => sec.lessons.forEach(l => this._all.push({ ...l, moduleId: m.id, sectionId: sec.id, sectionTitle: sec.title }))));
    return this._all;
  },
  totalLessons() { return this.allLessons().length; },
  getModule(id) { return DATA.modules.find(m => m.id === id); },
  getLesson(id) { return this.allLessons().find(l => l.id === id); },
  moduleLessons(mid) { return this.allLessons().filter(l => l.moduleId === mid); },
  moduleProgress(mid) {
    const ls = this.moduleLessons(mid);
    const done = ls.filter(l => this.state.completedLessons[l.id]).length;
    return ls.length ? Math.round(done / ls.length * 100) : 0;
  },
  /* Celkový progres: 70 % lekcie, 15 % projekty, 15 % certifikácie */
  overallProgress() {
    const lessons = Object.keys(this.state.completedLessons).length / this.totalLessons();
    const projects = Object.values(this.state.projects).filter(p => p.status === 'done').length / DATA.projects.length;
    const certs = Object.values(this.state.certs).filter(c => c.done).length / DATA.certs.length;
    return Math.round((lessons * 0.7 + projects * 0.15 + certs * 0.15) * 100);
  },

  /* ── Gamifikácia: XP a levely ── */
  LEVELS: [
    { name: 'Začiatočník', xp: 0, icon: '🌱' },
    { name: 'Junior', xp: 1200, icon: '🌿' },
    { name: 'Medior', xp: 3500, icon: '🌳' },
    { name: 'Senior', xp: 7000, icon: '⭐' },
    { name: 'Expert', xp: 12000, icon: '🏆' },
  ],
  level() {
    let lv = this.LEVELS[0], next = null;
    for (let i = 0; i < this.LEVELS.length; i++) {
      if (this.state.xp >= this.LEVELS[i].xp) { lv = this.LEVELS[i]; next = this.LEVELS[i + 1] || null; }
    }
    return { ...lv, next };
  },
  addXP(amount, reason) {
    this.state.xp += amount;
    this.save();
    this.toast(`+${amount} XP`, reason || '', '⚡');
    this.checkAchievements();
    this.refreshTopbar();
  },

  /* ── Streak (séria dní) ── */
  todayKey() { const d = new Date(); return d.toISOString().slice(0, 10); },
  touchStreak() {
    const today = this.todayKey();
    const s = this.state.streak;
    if (s.last === today) return;
    const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    s.count = (s.last === yest) ? s.count + 1 : 1;
    s.last = today;
    this.save();
    if (s.count > 1) this.toast(`🔥 Séria ${s.count} dní!`, 'Len tak ďalej', '');
  },

  /* ── Časomiera učenia (aktívny čas v aplikácii) ── */
  startTimer() {
    // Každú minútu, keď je karta viditeľná, pripíše 1 minútu do denného logu.
    setInterval(() => {
      if (document.hidden) return;
      const k = this.todayKey();
      this.state.timeLog[k] = (this.state.timeLog[k] || 0) + 1;
      if (this.state.timeLog[k] === this.state.dailyGoalMin) this.toast('🎯 Denný cieľ splnený!', `${this.state.dailyGoalMin} minút učenia`, '');
      this.save();
    }, 60000);
  },
  totalMinutes() { return Object.values(this.state.timeLog).reduce((a, b) => a + b, 0); },

  /* ── Achievementy ── */
  checkAchievements() {
    DATA.achievements.forEach(a => {
      if (!this.state.achievements[a.id] && a.check(this.state)) {
        this.state.achievements[a.id] = Date.now();
        this.save();
        this.toast(`${a.icon} ${a.name}`, a.desc, '');
      }
    });
  },

  /* ── Toasty ── */
  toast(title, sub, icon) {
    const el = document.createElement('div');
    el.className = 'animate-pop pointer-events-auto rounded-2xl border border-zinc-200 dark:border-zinc-700/70 bg-white dark:bg-[#1a1a1f] shadow-xl px-4 py-3 flex items-center gap-3';
    el.innerHTML = `<span class="text-xl">${icon || ''}</span><div class="min-w-0"><div class="font-semibold text-sm text-zinc-900 dark:text-white truncate">${title}</div>${sub ? `<div class="text-xs text-zinc-500 truncate">${sub}</div>` : ''}</div>`;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .4s, transform .4s'; el.style.opacity = 0; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 400); }, 3200);
  },

  /* ── Téma ── */
  applyTheme() {
    document.documentElement.classList.toggle('dark', this.state.theme === 'dark');
    document.querySelector('meta[name="theme-color"]').content = this.state.theme === 'dark' ? '#09090b' : '#fafafa';
  },
  toggleTheme() { this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark'; this.save(); this.applyTheme(); },

  /* ── Router ── */
  NAV: [
    { id: 'dashboard', name: 'Prehľad', icon: 'layout-dashboard' },
    { id: 'modules', name: 'Moduly', icon: 'book-open' },
    { id: 'tests', name: 'Testy', icon: 'clipboard-check' },
    { id: 'flashcards', name: 'Flashcards', icon: 'layers' },
    { id: 'projects', name: 'Projekty', icon: 'briefcase' },
    { id: 'certs', name: 'Certifikácie', icon: 'award' },
    { id: 'glossary', name: 'Slovník', icon: 'book-a' },
    { id: 'career', name: 'Kariéra', icon: 'trending-up' },
    { id: 'stats', name: 'Štatistiky', icon: 'bar-chart-3' },
    { id: 'mentor', name: 'AI Mentor', icon: 'bot' },
  ],
  MOBILE_NAV: ['dashboard', 'modules', 'tests', 'mentor', 'stats'],
  current: { view: 'dashboard', params: {} },

  /* Navigačné položky — Admin sekcia sa pridá len administrátorovi */
  navItems() {
    const items = [...this.NAV];
    if (typeof Auth !== 'undefined' && Auth.isAdmin()) items.push({ id: 'admin', name: 'Admin', icon: 'shield' });
    return items;
  },

  go(view, params = {}) {
    this.current = { view, params };
    this.render();
    window.scrollTo({ top: 0 });
  },

  render() {
    const { view, params } = this.current;
    const fn = Views[view] || Views.dashboard;
    // .call(Views) — metódy obrazoviek používajú this na zdieľané komponenty
    document.getElementById('main').innerHTML = `<div class="animate-slide-up">${fn.call(Views, params)}</div>`;
    document.getElementById('page-title').textContent = this.pageTitle();
    this.renderNav();
    this.refreshTopbar();
    if (window.lucide) lucide.createIcons();
    if (Views.afterRender[view]) Views.afterRender[view](params);
  },
  pageTitle() {
    const { view, params } = this.current;
    if (view === 'lesson') { const l = this.getLesson(params.id); return l ? l.title : 'Lekcia'; }
    if (view === 'module') { const m = this.getModule(params.id); return m ? m.name : 'Modul'; }
    const n = this.navItems().find(n => n.id === view);
    return n ? n.name : 'G-Academy';
  },
  renderNav() {
    const active = this.current.view === 'lesson' || this.current.view === 'module' ? 'modules' : this.current.view;
    document.getElementById('nav-desktop').innerHTML = this.navItems().map(n => `
      <button onclick="App.go('${n.id}')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-xl text-left transition hover:bg-zinc-100 dark:hover:bg-zinc-800/70 ${active === n.id ? 'active font-semibold' : 'text-zinc-600 dark:text-zinc-400'}">
        <i data-lucide="${n.icon}" class="w-4 h-4 shrink-0"></i><span>${n.name}</span>
      </button>`).join('');
    document.getElementById('nav-mobile').innerHTML = this.MOBILE_NAV.map(id => {
      const n = this.NAV.find(x => x.id === id);
      return `<button onclick="App.go('${n.id}')" class="flex flex-col items-center gap-0.5 px-3 py-1 text-[10px] ${active === id ? 'text-indigo-500 font-semibold' : 'text-zinc-500'}">
        <i data-lucide="${n.icon}" class="w-5 h-5"></i>${n.name}</button>`;
    }).join('');
    // Sidebar footer: level widget
    const lv = this.level();
    const nextXp = lv.next ? lv.next.xp : lv.xp;
    const prevXp = lv.xp;
    const pct = lv.next ? Math.min(100, Math.round((this.state.xp - prevXp) / (nextXp - prevXp) * 100)) : 100;
    document.getElementById('sidebar-footer').innerHTML = `
      <div class="flex items-center gap-2 mb-2"><span class="text-lg">${lv.icon}</span>
        <div class="min-w-0 flex-1"><div class="text-xs font-bold text-zinc-900 dark:text-white">${lv.name}</div>
        <div class="text-[10px] text-zinc-500">${this.state.xp} XP ${lv.next ? '· do ' + lv.next.name + ': ' + (lv.next.xp - this.state.xp) : '· MAX'}</div></div></div>
      <div class="h-1.5 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500" style="width:${pct}%"></div></div>`;
  },
  refreshTopbar() {
    document.getElementById('topbar-streak').textContent = `🔥 ${this.state.streak.count}`;
    document.getElementById('topbar-xp').textContent = `⚡ ${this.state.xp} XP`;
  },

  /* ── Modal ── */
  modal(html, wide) {
    document.getElementById('modal-root').innerHTML = `
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="App.closeModal()"></div>
        <div class="relative animate-pop w-full ${wide ? 'max-w-3xl' : 'max-w-lg'} max-h-[85vh] overflow-y-auto rounded-2xl border border-zinc-200 dark:border-zinc-700/70 bg-white dark:bg-[#141418] p-6 shadow-2xl">${html}</div>
      </div>`;
    if (window.lucide) lucide.createIcons();
  },
  closeModal() { document.getElementById('modal-root').innerHTML = ''; },

  /* ── Lekcie: dokončenie, checklisty ── */
  toggleCheck(lessonId, idx) {
    const l = this.getLesson(lessonId);
    if (!this.state.checklistState[lessonId]) this.state.checklistState[lessonId] = l.checklist.map(() => false);
    this.state.checklistState[lessonId][idx] = !this.state.checklistState[lessonId][idx];
    this.save();
    this.render();
  },
  completeLesson(id) {
    if (this.state.completedLessons[id]) return;
    const l = this.getLesson(id);
    this.state.completedLessons[id] = Date.now();
    this.touchStreak();
    this.save();
    this.addXP(l.min * 2, `Lekcia: ${l.title}`);
    // týždenný cieľ
    const week = this.lessonsThisWeek();
    if (week === this.state.weeklyGoalLessons) this.toast('📅 Týždenný cieľ splnený!', `${week} lekcií tento týždeň`, '');
    this.render();
  },
  lessonsThisWeek() {
    const now = new Date(); const day = (now.getDay() + 6) % 7; // pondelok=0
    const monday = new Date(now); monday.setHours(0, 0, 0, 0); monday.setDate(now.getDate() - day);
    return Object.values(this.state.completedLessons).filter(t => t >= monday.getTime()).length;
  },

  /* ── Testový engine (kvízy lekcií, modulové, finálny, mock cert) ──
     Testy neukazujú správne odpovede priebežne — vyhodnotenie s
     vysvetleniami až na konci (ako reálne certifikácie). */
  quiz: null,
  startQuiz(type, refId) {
    let questions = [], title = '', quizId = '';
    if (type === 'lesson') {
      const l = this.getLesson(refId);
      questions = l.quiz.map((q, i) => ({ ...q, src: l.id + ':' + i }));
      title = 'Mini test: ' + l.title; quizId = 'lesson:' + refId;
    } else if (type === 'module') {
      const pool = this.moduleLessons(refId).flatMap(l => l.quiz.map((q, i) => ({ ...q, src: l.id + ':' + i })));
      questions = this.sample(pool, 20);
      title = 'Modulový test: ' + this.getModule(refId).name; quizId = 'module:' + refId;
    } else if (type === 'final') {
      const pool = this.allLessons().flatMap(l => l.quiz.map((q, i) => ({ ...q, src: l.id + ':' + i })));
      questions = this.sample(pool, 100);
      title = 'Záverečný test (100 otázok)'; quizId = 'final';
    } else if (type === 'cert') {
      const pool = this.moduleLessons('ads').flatMap(l => l.quiz.map((q, i) => ({ ...q, src: l.id + ':' + i })));
      questions = this.sample(pool, 50);
      title = 'Mock certifikačný test (Ads, 50 otázok)'; quizId = 'cert-mock';
    }
    this.quiz = { type, refId, quizId, title, questions, answers: new Array(questions.length).fill(null), idx: 0 };
    Views.renderQuiz();
  },
  sample(arr, n) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a.slice(0, Math.min(n, a.length));
  },
  answerQuiz(optIdx) {
    this.quiz.answers[this.quiz.idx] = optIdx;
    Views.renderQuiz();
  },
  quizNav(dir) {
    this.quiz.idx = Math.max(0, Math.min(this.quiz.questions.length - 1, this.quiz.idx + dir));
    Views.renderQuiz();
  },
  finishQuiz() {
    const q = this.quiz;
    const score = q.questions.reduce((s, question, i) => s + (q.answers[i] === question.c ? 1 : 0), 0);
    const total = q.questions.length;
    // uloženie najlepšieho výsledku + histórie
    const prev = this.state.quizResults[q.quizId];
    if (!prev || score / total > prev.score / prev.total) this.state.quizResults[q.quizId] = { score, total, date: Date.now() };
    this.state.testHistory.push({ type: q.type, id: q.quizId, score, total, date: Date.now() });
    this.touchStreak();
    this.save();
    const pct = Math.round(score / total * 100);
    const xp = q.type === 'lesson' ? score * 10 : q.type === 'module' ? score * 15 : score * 20;
    this.addXP(xp, `Test: ${pct} %`);
    q.finished = true; q.score = score;
    Views.renderQuiz();
  },

  /* ── Flashcards: zjednodušený SM-2 spaced repetition ──
     Hodnotenie: 0=nevedel, 1=ťažké, 2=dobré, 3=ľahké */
  fcState(id) {
    if (!this.state.flashcards[id]) this.state.flashcards[id] = { due: 0, interval: 0, ease: 2.5, reps: 0 };
    return this.state.flashcards[id];
  },
  fcDueCards() {
    const now = Date.now();
    return DATA.flashcards.filter(c => this.fcState(c.id).due <= now);
  },
  fcReview(cardId, grade) {
    const s = this.fcState(cardId);
    if (grade === 0) { s.interval = 0; s.reps = 0; s.ease = Math.max(1.3, s.ease - 0.2); }
    else {
      s.reps++;
      if (s.reps === 1) s.interval = 1;
      else if (s.reps === 2) s.interval = 3;
      else s.interval = Math.round(s.interval * s.ease);
      if (grade === 1) { s.ease = Math.max(1.3, s.ease - 0.15); s.interval = Math.max(1, Math.round(s.interval * 0.7)); }
      if (grade === 3) s.ease += 0.1;
    }
    s.due = Date.now() + (s.interval === 0 ? 10 * 60 * 1000 : s.interval * 864e5);
    this.state.fcReviews = (this.state.fcReviews || 0) + 1;
    this.touchStreak();
    this.save();
    this.addXP(grade > 0 ? 5 : 2, 'Flashcard');
    this.checkAchievements();
  },

  /* ── Certifikácie ── */
  certReadiness(cert) {
    // Pravdepodobnosť úspechu = kombinácia progresu modulov + výsledkov testov
    let base = 0, weight = 0;
    Object.entries(cert.reqModules).forEach(([mid, req]) => {
      base += Math.min(1, this.moduleProgress(mid) / req) * 60; weight += 60;
    });
    const modTests = this.state.testHistory.filter(t => t.type !== 'lesson');
    const best = modTests.length ? Math.max(...modTests.map(t => t.score / t.total)) : 0;
    base += best * 40; weight += 40;
    return Math.round(base / weight * 100);
  },
  toggleCert(id) {
    const c = this.state.certs[id] || { done: false };
    c.done = !c.done; c.date = c.done ? Date.now() : null;
    this.state.certs[id] = c;
    this.save();
    if (c.done) this.addXP(500, 'Certifikácia získaná! 🎉');
    this.checkAchievements();
    this.render();
  },

  /* ── Projekty ── */
  projState(id) {
    if (!this.state.projects[id]) {
      const p = DATA.projects.find(x => x.id === id);
      this.state.projects[id] = { status: 'todo', notes: '', checks: p.checklist.map(() => false), rating: 0 };
    }
    return this.state.projects[id];
  },
  projToggleCheck(pid, idx) {
    const s = this.projState(pid); s.checks[idx] = !s.checks[idx];
    if (s.status === 'todo' && s.checks.some(Boolean)) s.status = 'progress';
    this.save(); this.render();
  },
  projSetStatus(pid, status) {
    const s = this.projState(pid);
    const was = s.status; s.status = status;
    this.save();
    if (status === 'done' && was !== 'done') {
      const p = DATA.projects.find(x => x.id === pid);
      this.addXP(p.xp, `Projekt: ${p.name}`);
    }
    this.checkAchievements(); this.render();
  },
  projSaveNotes(pid, val) { this.projState(pid).notes = val; this.save(); },
  projSetRating(pid, r) { this.projState(pid).rating = r; this.save(); this.render(); },

  /* ── Init ── */
  init() {
    this.load();
    this.applyTheme();
    this.startTimer();
    this.render();
    this.checkAchievements();
    // PWA service worker (funguje len cez http(s), pri file:// sa ticho preskočí)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  },
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   VIEWS — obrazovky aplikácie (časť A)
   Každá funkcia vracia HTML reťazec; afterRender rieši grafy a pod.
   ═══════════════════════════════════════════════════════════════════ */

const Views = {
  afterRender: {},

  /* ── Pomocné UI komponenty ── */
  card(inner, cls = '') {
    return `<div class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316] p-5 ${cls}">${inner}</div>`;
  },
  progressBar(pct, color = 'from-indigo-500 to-violet-500', h = 'h-2') {
    return `<div class="${h} rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r ${color} transition-all duration-700" style="width:${pct}%"></div></div>`;
  },
  statCard(icon, value, label, color) {
    return this.card(`
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style="background:${color}18;color:${color}">
          <i data-lucide="${icon}" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0"><div class="text-xl font-bold text-zinc-900 dark:text-white leading-tight">${value}</div>
        <div class="text-xs text-zinc-500 truncate">${label}</div></div>
      </div>`);
  },
  chip(text, color) { return `<span class="chip" style="background:${color}18;color:${color}">${text}</span>`; },
  moduleColor(mid) { return App.getModule(mid)?.color || '#6366f1'; },

  /* ════════ DASHBOARD ════════ */
  dashboard() {
    const s = App.state;
    const overall = App.overallProgress();
    const lv = App.level();
    const lessonsDone = Object.keys(s.completedLessons).length;
    const testsDone = s.testHistory.length;
    const correct = s.testHistory.reduce((a, t) => a + t.score, 0);
    const totalQ = s.testHistory.reduce((a, t) => a + t.total, 0);
    const certsDone = Object.values(s.certs).filter(c => c.done).length;
    const projDone = Object.values(s.projects).filter(p => p.status === 'done').length;
    const hours = (App.totalMinutes() / 60).toFixed(1);
    const todayMin = s.timeLog[App.todayKey()] || 0;
    const weekLessons = App.lessonsThisWeek();
    const dueCards = App.fcDueCards().length;

    // Odporúčanie ďalšieho kroku
    const nextLesson = App.allLessons().find(l => !s.completedLessons[l.id]);

    // SVG progress ring
    const r = 52, circ = 2 * Math.PI * r, off = circ * (1 - overall / 100);

    return `
    <div class="grid gap-4">
      <!-- Hero: celkový progres + level -->
      <div class="grid md:grid-cols-3 gap-4">
        ${this.card(`
          <div class="flex items-center gap-5">
            <svg width="128" height="128" viewBox="0 0 128 128" class="shrink-0 -rotate-90">
              <circle cx="64" cy="64" r="${r}" fill="none" stroke="currentColor" class="text-zinc-200 dark:text-zinc-800" stroke-width="10"/>
              <circle cx="64" cy="64" r="${r}" fill="none" stroke="url(#pg)" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="${circ}" stroke-dashoffset="${off}" class="ring-anim"/>
              <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>
              <text x="64" y="60" text-anchor="middle" transform="rotate(90 64 64)" class="fill-zinc-900 dark:fill-white" style="font-size:26px;font-weight:800">${overall}%</text>
              <text x="64" y="78" text-anchor="middle" transform="rotate(90 64 64)" class="fill-zinc-400" style="font-size:9px">celkový progres</text>
            </svg>
            <div class="min-w-0">
              <div class="text-xs uppercase tracking-widest text-zinc-500 font-semibold mb-1">Úroveň</div>
              <div class="text-2xl font-extrabold text-zinc-900 dark:text-white flex items-center gap-2">${lv.icon} ${lv.name}</div>
              <div class="text-sm text-zinc-500 mt-1">${s.xp} XP ${lv.next ? `· do úrovne ${lv.next.name} chýba <b class="text-indigo-400">${lv.next.xp - s.xp} XP</b>` : '· maximálna úroveň!'}</div>
              ${nextLesson ? `<button onclick="App.go('lesson',{id:'${nextLesson.id}'})" class="btn-press mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition">
                <i data-lucide="play" class="w-4 h-4"></i> Pokračovať v učení</button>` :
                `<div class="mt-3 text-sm font-semibold text-emerald-500">🎉 Všetky lekcie dokončené!</div>`}
            </div>
          </div>`, 'md:col-span-2')}
        ${this.card(`
          <div class="text-xs uppercase tracking-widest text-zinc-500 font-semibold mb-3">Dnešné ciele</div>
          <div class="space-y-3">
            <div>
              <div class="flex justify-between text-sm mb-1"><span>🎯 Učenie dnes</span><b>${todayMin}/${s.dailyGoalMin} min</b></div>
              ${this.progressBar(Math.min(100, todayMin / s.dailyGoalMin * 100), 'from-emerald-500 to-teal-400')}
            </div>
            <div>
              <div class="flex justify-between text-sm mb-1"><span>📅 Lekcie (týždeň)</span><b>${weekLessons}/${s.weeklyGoalLessons}</b></div>
              ${this.progressBar(Math.min(100, weekLessons / s.weeklyGoalLessons * 100), 'from-sky-500 to-cyan-400')}
            </div>
            <div class="flex items-center justify-between text-sm pt-1">
              <span>🔥 Séria dní</span><b class="text-orange-500">${s.streak.count} ${s.streak.count === 1 ? 'deň' : s.streak.count < 5 ? 'dni' : 'dní'}</b>
            </div>
            ${dueCards ? `<button onclick="App.go('flashcards')" class="w-full btn-press text-left text-sm px-3 py-2 rounded-xl bg-amber-500/10 text-amber-500 font-semibold">🃏 ${dueCards} kartičiek na zopakovanie</button>` : ''}
          </div>`)}
      </div>

      <!-- Štatistické karty -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        ${this.statCard('clock', hours + ' h', 'Odpracované hodiny', '#6366f1')}
        ${this.statCard('book-open', lessonsDone + ' / ' + App.totalLessons(), 'Absolvované lekcie', '#10b981')}
        ${this.statCard('clipboard-check', testsDone, 'Absolvované testy', '#3b82f6')}
        ${this.statCard('check-circle-2', correct + (totalQ ? ' / ' + totalQ : ''), 'Správne odpovede', '#22c55e')}
        ${this.statCard('briefcase', projDone + ' / ' + DATA.projects.length, 'Dokončené projekty', '#f59e0b')}
        ${this.statCard('award', certsDone + ' / ' + DATA.certs.length, 'Získané certifikácie', '#a855f7')}
        ${this.statCard('zap', s.xp + ' XP', 'Skúsenostné body', '#eab308')}
        ${this.statCard('trophy', Object.keys(s.achievements).length + ' / ' + DATA.achievements.length, 'Achievementy', '#ef4444')}
      </div>

      <!-- Moduly -->
      <div class="mt-2">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-lg text-zinc-900 dark:text-white">Študijné moduly</h2>
          <button onclick="App.go('modules')" class="text-sm text-indigo-400 hover:underline">Všetky moduly →</button>
        </div>
        <div class="grid md:grid-cols-3 gap-4">${DATA.modules.map(m => this.moduleCard(m)).join('')}</div>
      </div>

      <!-- Achievementy (posledné) -->
      ${Object.keys(s.achievements).length ? `<div class="mt-2">
        <h2 class="font-bold text-lg text-zinc-900 dark:text-white mb-3">Odznaky</h2>
        <div class="flex flex-wrap gap-2">${DATA.achievements.filter(a => s.achievements[a.id]).map(a =>
          `<div class="chip bg-zinc-100 dark:bg-zinc-800/80 text-zinc-700 dark:text-zinc-300 !py-1.5" title="${a.desc}">${a.icon} ${a.name}</div>`).join('')}</div>
      </div>` : ''}
    </div>`;
  },

  moduleCard(m) {
    const pct = App.moduleProgress(m.id);
    const done = App.moduleLessons(m.id).filter(l => App.state.completedLessons[l.id]).length;
    return `
    <div class="card-hover rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316] p-5 flex flex-col">
      <div class="flex items-start justify-between mb-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background:${m.color}18;color:${m.color}">
          <i data-lucide="${m.icon}" class="w-5 h-5"></i>
        </div>
        ${this.chip(m.difficulty, m.color)}
      </div>
      <h3 class="font-bold text-zinc-900 dark:text-white">${m.name}</h3>
      <p class="text-sm text-zinc-500 mt-1 mb-3 flex-1">${m.desc}</p>
      <div class="flex items-center gap-3 text-xs text-zinc-500 mb-2">
        <span class="inline-flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i>~${m.hours} h</span>
        <span class="inline-flex items-center gap-1"><i data-lucide="book-open" class="w-3.5 h-3.5"></i>${done}/${App.moduleLessons(m.id).length} lekcií</span>
        <span class="ml-auto font-bold" style="color:${m.color}">${pct} %</span>
      </div>
      ${this.progressBar(pct, '', 'h-1.5').replace('from-indigo-500 to-violet-500', '').replace('bg-gradient-to-r', '').replace('style="width', `style="background:${m.color};width`)}
      <button onclick="App.go('module',{id:'${m.id}'})" class="btn-press mt-4 w-full py-2 rounded-xl text-sm font-semibold text-white transition hover:opacity-90" style="background:${m.color}">
        ${pct === 0 ? 'Začať' : pct === 100 ? 'Zopakovať' : 'Pokračovať'}
      </button>
    </div>`;
  },

  /* ════════ MODULY (zoznam) ════════ */
  modules() {
    return `
    <div class="grid md:grid-cols-3 gap-4">${DATA.modules.map(m => this.moduleCard(m)).join('')}</div>
    <div class="mt-6">${this.card(`
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-violet-500/10 text-violet-400 flex items-center justify-center"><i data-lucide="graduation-cap" class="w-5 h-5"></i></div>
        <div class="flex-1">
          <div class="font-bold text-zinc-900 dark:text-white">Ako študovať</div>
          <div class="text-sm text-zinc-500">Odporúčané poradie: GBP → GSC → Ads. Každá lekcia = teória → checklist → mini test. Po sekciách si dávaj modulové testy a kartičky. Na konci každého modulu ťa čaká praktický projekt do portfólia.</div>
        </div>
      </div>`)}</div>`;
  },

  /* ════════ DETAIL MODULU ════════ */
  module(params) {
    const m = App.getModule(params.id);
    const pct = App.moduleProgress(m.id);
    const best = App.state.quizResults['module:' + m.id];
    return `
    <div class="mb-5">${this.card(`
      <div class="flex flex-wrap items-center gap-4">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:${m.color}18;color:${m.color}"><i data-lucide="${m.icon}" class="w-7 h-7"></i></div>
        <div class="flex-1 min-w-[200px]">
          <h2 class="text-xl font-extrabold text-zinc-900 dark:text-white">${m.name}</h2>
          <div class="text-sm text-zinc-500">${m.desc}</div>
        </div>
        <div class="text-right">
          <div class="text-2xl font-extrabold" style="color:${m.color}">${pct} %</div>
          <div class="text-xs text-zinc-500">~${m.hours} h · ${m.difficulty}</div>
        </div>
      </div>
      <div class="mt-4">${this.progressBar(pct, '', 'h-2').replace('bg-gradient-to-r from-indigo-500 to-violet-500', '').replace('style="width', `style="background:${m.color};width`)}</div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button onclick="App.startQuiz('module','${m.id}')" class="btn-press px-4 py-2 rounded-xl text-sm font-semibold border border-zinc-300 dark:border-zinc-700 hover:border-indigo-500 transition">
          📝 Modulový test (20 otázok)${best ? ` · najlepšie ${Math.round(best.score / best.total * 100)} %` : ''}
        </button>
        <button onclick="App.go('projects')" class="btn-press px-4 py-2 rounded-xl text-sm font-semibold border border-zinc-300 dark:border-zinc-700 hover:border-indigo-500 transition">💼 Projekty modulu</button>
      </div>`)}
    </div>
    ${m.sections.map((sec, si) => `
      <div class="mb-5">
        <h3 class="font-bold text-zinc-900 dark:text-white mb-2 flex items-center gap-2">
          <span class="w-6 h-6 rounded-lg text-xs flex items-center justify-center font-bold" style="background:${m.color}18;color:${m.color}">${si + 1}</span>
          ${sec.title}
        </h3>
        <div class="grid gap-2">
          ${sec.lessons.map(l => {
            const done = !!App.state.completedLessons[l.id];
            const quiz = App.state.quizResults['lesson:' + l.id];
            return `<button onclick="App.go('lesson',{id:'${l.id}'})" class="btn-press text-left rounded-xl border ${done ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316]'} px-4 py-3 flex items-center gap-3 hover:border-indigo-500/50 transition">
              <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 ${done ? 'bg-emerald-500 text-white' : 'border-2 border-zinc-300 dark:border-zinc-700'}">${done ? '✓' : ''}</span>
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-sm text-zinc-900 dark:text-white truncate">${l.title}</div>
                <div class="text-xs text-zinc-500">${l.min} min${quiz ? ` · test ${Math.round(quiz.score / quiz.total * 100)} %` : ''}</div>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-400 shrink-0"></i>
            </button>`;
          }).join('')}
        </div>
      </div>`).join('')}`;
  },

  /* ════════ LEKCIA ════════ */
  lesson(params) {
    const l = App.getLesson(params.id);
    const m = App.getModule(l.moduleId);
    const done = !!App.state.completedLessons[l.id];
    const checks = App.state.checklistState[l.id] || l.checklist.map(() => false);
    const quiz = App.state.quizResults['lesson:' + l.id];
    const all = App.allLessons();
    const idx = all.findIndex(x => x.id === l.id);
    const prev = all[idx - 1], next = all[idx + 1];

    return `
    <button onclick="App.go('module',{id:'${m.id}'})" class="text-sm text-zinc-500 hover:text-indigo-400 mb-3 inline-flex items-center gap-1">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> ${m.name} · ${l.sectionTitle}
    </button>

    ${this.card(`
      <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
        <h2 class="text-xl font-extrabold text-zinc-900 dark:text-white">${l.title}</h2>
        <div class="flex gap-2">${this.chip('⏱ ' + l.min + ' min', m.color)}${done ? this.chip('✓ Dokončené', '#10b981') : ''}</div>
      </div>
      <div class="prose-lesson text-[15px] text-zinc-700 dark:text-zinc-300 mt-3">${l.theory}</div>`)}

    <!-- Kontrolný zoznam lekcie -->
    <div class="mt-4">${this.card(`
      <h3 class="font-bold text-zinc-900 dark:text-white mb-3 flex items-center gap-2"><i data-lucide="list-checks" class="w-4 h-4 text-indigo-400"></i> Kontrolný zoznam</h3>
      <div class="space-y-2">
        ${l.checklist.map((c, i) => `
        <label class="flex items-start gap-3 cursor-pointer group">
          <input type="checkbox" ${checks[i] ? 'checked' : ''} onchange="App.toggleCheck('${l.id}',${i})"
            class="mt-0.5 w-4 h-4 rounded accent-indigo-500 shrink-0">
          <span class="text-sm ${checks[i] ? 'line-through text-zinc-400' : 'text-zinc-700 dark:text-zinc-300'} group-hover:text-indigo-400 transition">${c}</span>
        </label>`).join('')}
      </div>`)}
    </div>

    <!-- Akcie -->
    <div class="mt-4 grid sm:grid-cols-2 gap-3">
      <button onclick="App.startQuiz('lesson','${l.id}')" class="btn-press py-3 rounded-xl font-semibold border-2 border-indigo-500/50 text-indigo-400 hover:bg-indigo-500/10 transition">
        📝 Mini test (5 otázok)${quiz ? ` · najlepšie ${Math.round(quiz.score / quiz.total * 100)} %` : ''}
      </button>
      <button onclick="App.completeLesson('${l.id}')" ${done ? 'disabled' : ''}
        class="btn-press py-3 rounded-xl font-semibold text-white transition ${done ? 'bg-emerald-600/50 cursor-default' : 'bg-emerald-600 hover:bg-emerald-500'}">
        ${done ? '✓ Lekcia dokončená' : '✔ Označiť ako dokončené (+' + (l.min * 2) + ' XP)'}
      </button>
    </div>

    <!-- Navigácia medzi lekciami -->
    <div class="mt-4 flex justify-between text-sm">
      ${prev ? `<button onclick="App.go('lesson',{id:'${prev.id}'})" class="text-zinc-500 hover:text-indigo-400 inline-flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> ${prev.title}</button>` : '<span></span>'}
      ${next ? `<button onclick="App.go('lesson',{id:'${next.id}'})" class="text-zinc-500 hover:text-indigo-400 inline-flex items-center gap-1 text-right">${next.title} <i data-lucide="arrow-right" class="w-4 h-4"></i></button>` : '<span></span>'}
    </div>`;
  },

  /* ════════ TESTY (centrum) ════════ */
  tests() {
    const s = App.state;
    const history = [...s.testHistory].reverse().slice(0, 10);
    return `
    <div class="grid md:grid-cols-2 gap-4">
      ${this.card(`
        <h3 class="font-bold text-zinc-900 dark:text-white mb-1">📝 Modulové testy</h3>
        <p class="text-sm text-zinc-500 mb-4">20 náhodných otázok z celého modulu. Odporúčané po dokončení modulu — 80 %+ znamená pripravenosť.</p>
        <div class="space-y-2">
          ${DATA.modules.map(m => {
            const best = s.quizResults['module:' + m.id];
            return `<button onclick="App.startQuiz('module','${m.id}')" class="btn-press w-full flex items-center gap-3 px-4 py-3 rounded-xl border border-zinc-200 dark:border-zinc-800 hover:border-indigo-500/50 transition text-left">
              <i data-lucide="${m.icon}" class="w-5 h-5" style="color:${m.color}"></i>
              <span class="flex-1 font-semibold text-sm">${m.name}</span>
              ${best ? `<span class="text-xs font-bold ${best.score / best.total >= 0.8 ? 'text-emerald-500' : 'text-amber-500'}">${Math.round(best.score / best.total * 100)} %</span>` : '<span class="text-xs text-zinc-500">—</span>'}
            </button>`;
          }).join('')}
        </div>`)}
      ${this.card(`
        <h3 class="font-bold text-zinc-900 dark:text-white mb-1">👑 Veľké skúšky</h3>
        <p class="text-sm text-zinc-500 mb-4">Simulácie reálnych certifikačných podmienok. Správne odpovede a vysvetlenia uvidíš až na konci.</p>
        <div class="space-y-2">
          <button onclick="App.startQuiz('final')" class="btn-press w-full flex items-center gap-3 px-4 py-3 rounded-xl border-2 border-violet-500/40 hover:bg-violet-500/10 transition text-left">
            <span class="text-lg">👑</span>
            <span class="flex-1"><span class="font-semibold text-sm block">Záverečný test kurzu</span><span class="text-xs text-zinc-500">100 otázok zo všetkých modulov</span></span>
            ${s.quizResults['final'] ? `<span class="text-xs font-bold text-emerald-500">${Math.round(s.quizResults['final'].score / s.quizResults['final'].total * 100)} %</span>` : ''}
          </button>
          <button onclick="App.startQuiz('cert')" class="btn-press w-full flex items-center gap-3 px-4 py-3 rounded-xl border-2 border-amber-500/40 hover:bg-amber-500/10 transition text-left">
            <span class="text-lg">🎓</span>
            <span class="flex-1"><span class="font-semibold text-sm block">Mock certifikačný test</span><span class="text-xs text-zinc-500">50 otázok · Ads · cieľ 80 % ako na Skillshope</span></span>
            ${s.quizResults['cert-mock'] ? `<span class="text-xs font-bold text-emerald-500">${Math.round(s.quizResults['cert-mock'].score / s.quizResults['cert-mock'].total * 100)} %</span>` : ''}
          </button>
        </div>
        <p class="text-xs text-zinc-500 mt-4">💡 Mini testy k lekciám (5 otázok) spúšťaš priamo v lekciách.</p>`)}
    </div>
    ${history.length ? `<div class="mt-4">${this.card(`
      <h3 class="font-bold text-zinc-900 dark:text-white mb-3">História testov</h3>
      <div class="space-y-1.5">${history.map(t => {
        const pct = Math.round(t.score / t.total * 100);
        const label = t.type === 'lesson' ? 'Mini test' : t.type === 'module' ? 'Modulový test' : t.type === 'final' ? 'Záverečný test' : 'Mock certifikácia';
        return `<div class="flex items-center gap-3 text-sm py-1.5 border-b border-zinc-100 dark:border-zinc-800/60 last:border-0">
          <span class="text-zinc-500 text-xs w-20">${new Date(t.date).toLocaleDateString('sk')}</span>
          <span class="flex-1">${label}</span>
          <span class="text-xs text-zinc-500">${t.score}/${t.total}</span>
          <span class="font-bold text-xs ${pct >= 80 ? 'text-emerald-500' : pct >= 60 ? 'text-amber-500' : 'text-red-500'}">${pct} %</span>
        </div>`;
      }).join('')}</div>`)}</div>` : ''}`;
  },

  /* ════════ QUIZ ENGINE (modálne okno) ════════ */
  renderQuiz() {
    const q = App.quiz;
    if (!q) return;

    /* Výsledková obrazovka s vysvetleniami všetkých odpovedí */
    if (q.finished) {
      const p = Math.round(q.score / q.questions.length * 100);
      App.modal(`
        <div class="text-center mb-5">
          <div class="text-5xl mb-2">${p >= 80 ? '🎉' : p >= 60 ? '💪' : '📚'}</div>
          <h3 class="text-2xl font-extrabold text-zinc-900 dark:text-white">${p} %</h3>
          <p class="text-sm text-zinc-500">${q.score} z ${q.questions.length} správne · ${p >= 80 ? 'Výborne — certifikačná úroveň!' : p >= 60 ? 'Dobré — ešte si prejdi vysvetlenia.' : 'Zopakuj si teóriu a skús to znova.'}</p>
        </div>
        <h4 class="font-bold text-sm text-zinc-900 dark:text-white mb-3">Vysvetlenie všetkých odpovedí</h4>
        <div class="space-y-3 mb-5">
          ${q.questions.map((question, i) => {
            const ok = q.answers[i] === question.c;
            return `<div class="rounded-xl border ${ok ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-red-500/30 bg-red-500/5'} p-3">
              <div class="text-sm font-semibold text-zinc-900 dark:text-white mb-1">${i + 1}. ${question.q}</div>
              <div class="text-xs ${ok ? 'text-emerald-500' : 'text-red-400'} mb-1">
                ${ok ? '✓ Správne: ' : '✗ Tvoja odpoveď: '}${q.answers[i] !== null ? question.o[q.answers[i]] : '(bez odpovede)'}
                ${!ok ? `<br>✓ Správne: ${question.o[question.c]}` : ''}
              </div>
              <div class="text-xs text-zinc-600 dark:text-zinc-400">${question.e}</div>
            </div>`;
          }).join('')}
        </div>
        <button onclick="App.closeModal();App.render()" class="btn-press w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Zavrieť</button>
      `, true);
      return;
    }

    /* Otázka */
    const cur = q.questions[q.idx];
    const answered = q.answers.filter(a => a !== null).length;
    App.modal(`
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-sm text-zinc-900 dark:text-white truncate pr-3">${q.title}</h3>
        <button onclick="App.closeModal()" class="text-zinc-400 hover:text-red-400 shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      ${this.progressBar((q.idx + 1) / q.questions.length * 100, 'from-indigo-500 to-violet-500', 'h-1.5')}
      <div class="text-xs text-zinc-500 mt-2 mb-4">Otázka ${q.idx + 1} / ${q.questions.length} · zodpovedaných ${answered}</div>
      <div class="font-semibold text-zinc-900 dark:text-white mb-4">${cur.q}</div>
      <div class="space-y-2 mb-5">
        ${cur.o.map((opt, i) => `
          <button onclick="App.answerQuiz(${i})" class="btn-press w-full text-left px-4 py-3 rounded-xl border text-sm transition
            ${q.answers[q.idx] === i ? 'border-indigo-500 bg-indigo-500/10 font-semibold' : 'border-zinc-200 dark:border-zinc-700 hover:border-indigo-400'}">
            <span class="inline-block w-5 font-bold text-zinc-400">${'ABCD'[i]}</span> ${opt}
          </button>`).join('')}
      </div>
      <div class="flex gap-2">
        <button onclick="App.quizNav(-1)" ${q.idx === 0 ? 'disabled' : ''} class="btn-press px-4 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 text-sm font-semibold ${q.idx === 0 ? 'opacity-40' : ''}">← Späť</button>
        ${q.idx < q.questions.length - 1
          ? `<button onclick="App.quizNav(1)" class="btn-press flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold">Ďalej →</button>`
          : `<button onclick="App.finishQuiz()" class="btn-press flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold">Vyhodnotiť test ✓</button>`}
      </div>
      <p class="text-[11px] text-zinc-500 mt-3">Správne odpovede a vysvetlenia sa zobrazia až po vyhodnotení — ako pri reálnej certifikácii.</p>
    `, false);
  },

  /* ════════ FLASHCARDS (spaced repetition) ════════ */
  fcSession: null,
  flashcards() {
    const due = App.fcDueCards();
    const total = DATA.flashcards.length;
    const learned = DATA.flashcards.filter(c => App.fcState(c.id).reps > 0).length;
    return `
    <div class="grid sm:grid-cols-3 gap-4 mb-5">
      ${this.statCard('layers', total, 'Kartičiek celkom', '#6366f1')}
      ${this.statCard('alarm-clock', due.length, 'Na zopakovanie dnes', '#f59e0b')}
      ${this.statCard('brain', learned, 'V učení (spaced repetition)', '#10b981')}
    </div>
    <div id="fc-area">
      ${due.length === 0
        ? this.card(`<div class="text-center py-8"><div class="text-4xl mb-3">🎉</div>
            <div class="font-bold text-zinc-900 dark:text-white">Všetko zopakované!</div>
            <p class="text-sm text-zinc-500 mt-1">Spaced repetition naplánoval ďalšie opakovania podľa tvojich odpovedí. Vráť sa zajtra — alebo si prejdi kartičky mimo plánu.</p>
            <button onclick="Views.fcStart(true)" class="btn-press mt-4 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold">Precvičiť všetky (mimo plánu)</button></div>`)
        : this.card(`<div class="text-center py-8"><div class="text-4xl mb-3">🃏</div>
            <div class="font-bold text-zinc-900 dark:text-white">${due.length} kartičiek čaká</div>
            <p class="text-sm text-zinc-500 mt-1">Hodnotenie určí, kedy sa kartička vráti: Nevedel som (10 min) → Ľahké (dlhé intervaly).</p>
            <button onclick="Views.fcStart(false)" class="btn-press mt-4 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold">Začať opakovanie</button></div>`)}
    </div>`;
  },
  fcStart(all) {
    const cards = all ? App.sample(DATA.flashcards, DATA.flashcards.length) : App.sample(App.fcDueCards(), 999);
    this.fcSession = { cards, idx: 0, flipped: false, offPlan: all };
    this.fcRender();
  },
  fcRender() {
    const s = this.fcSession;
    const area = document.getElementById('fc-area');
    if (!area) return;
    if (!s || s.idx >= s.cards.length) {
      this.fcSession = null;
      App.render();
      App.toast('🃏 Session hotová!', 'Skvelá práca', '');
      return;
    }
    const c = s.cards[s.idx];
    const mod = App.getModule(c.mod);
    area.innerHTML = `
      <div class="max-w-xl mx-auto">
        <div class="text-xs text-zinc-500 text-center mb-3">Kartička ${s.idx + 1} / ${s.cards.length} · ${mod.short}</div>
        <div class="fc-scene h-64 cursor-pointer" onclick="Views.fcFlip()">
          <div class="fc-card w-full h-full ${s.flipped ? 'flipped' : ''}">
            <div class="fc-face rounded-2xl border-2 border-indigo-500/40 bg-white dark:bg-[#16161b] p-6 flex flex-col items-center justify-center text-center">
              <div class="text-[10px] uppercase tracking-widest text-indigo-400 font-bold mb-3">Otázka</div>
              <div class="font-bold text-lg text-zinc-900 dark:text-white">${c.q}</div>
              <div class="text-xs text-zinc-500 mt-4">klikni pre odpoveď ↻</div>
            </div>
            <div class="fc-face fc-back rounded-2xl border-2 border-emerald-500/40 bg-white dark:bg-[#16161b] p-6 flex flex-col items-center justify-center text-center">
              <div class="text-[10px] uppercase tracking-widest text-emerald-500 font-bold mb-3">Odpoveď</div>
              <div class="text-sm text-zinc-800 dark:text-zinc-200 leading-relaxed">${c.a}</div>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-4 gap-2 mt-4 ${s.flipped ? '' : 'opacity-30 pointer-events-none'}">
          <button onclick="Views.fcGrade(0)" class="btn-press py-2.5 rounded-xl bg-red-500/15 text-red-400 text-xs font-bold">Nevedel som<br><span class="font-normal opacity-70">10 min</span></button>
          <button onclick="Views.fcGrade(1)" class="btn-press py-2.5 rounded-xl bg-amber-500/15 text-amber-500 text-xs font-bold">Ťažké<br><span class="font-normal opacity-70">kratší interval</span></button>
          <button onclick="Views.fcGrade(2)" class="btn-press py-2.5 rounded-xl bg-emerald-500/15 text-emerald-500 text-xs font-bold">Dobré<br><span class="font-normal opacity-70">štandard</span></button>
          <button onclick="Views.fcGrade(3)" class="btn-press py-2.5 rounded-xl bg-sky-500/15 text-sky-400 text-xs font-bold">Ľahké<br><span class="font-normal opacity-70">dlhší interval</span></button>
        </div>
      </div>`;

  },
  fcFlip() { this.fcSession.flipped = !this.fcSession.flipped; this.fcRender(); },
  fcGrade(g) {
    const s = this.fcSession;
    if (!s.offPlan) App.fcReview(s.cards[s.idx].id, g);
    else { App.state.fcReviews = (App.state.fcReviews || 0) + 1; App.save(); }
    s.idx++; s.flipped = false;
    this.fcRender();
  },

  /* ════════ PROJEKTY ════════ */
  projects() {
    return `
    <p class="text-sm text-zinc-500 mb-4">Praktické projekty tvoria tvoje <b>portfólio</b> — presne tieto výstupy budeš ukazovať agentúram a klientom. Každý dokončený projekt = veľký balík XP.</p>
    <div class="grid md:grid-cols-2 gap-4">
      ${DATA.projects.map(p => {
        const st = App.projState(p.id);
        const m = App.getModule(p.module);
        const donePct = Math.round(st.checks.filter(Boolean).length / p.checklist.length * 100);
        const statusChip = st.status === 'done' ? this.chip('✓ Dokončený', '#10b981') : st.status === 'progress' ? this.chip('⏳ Prebieha', '#f59e0b') : this.chip('○ Nezačatý', '#71717a');
        return `<div class="card-hover rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316] p-5">
          <div class="flex items-start justify-between mb-2">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${m.color}18;color:${m.color}"><i data-lucide="${p.icon}" class="w-5 h-5"></i></div>
            ${statusChip}
          </div>
          <h3 class="font-bold text-zinc-900 dark:text-white">${p.name}</h3>
          <p class="text-xs text-zinc-500 mt-1 mb-3">${p.goal}</p>
          ${this.progressBar(donePct, 'from-emerald-500 to-teal-400', 'h-1.5')}
          <div class="flex items-center justify-between mt-3">
            <span class="text-xs text-zinc-500">${st.checks.filter(Boolean).length}/${p.checklist.length} krokov · +${p.xp} XP</span>
            <button onclick="Views.openProject('${p.id}')" class="btn-press text-xs font-semibold px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white">Otvoriť</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  },
  openProject(pid) {
    const p = DATA.projects.find(x => x.id === pid);

    App.modal(`
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-lg text-zinc-900 dark:text-white">${p.name}</h3>
        <button onclick="App.closeModal()" class="text-zinc-400 hover:text-red-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="rounded-xl bg-indigo-500/10 border border-indigo-500/20 p-3 text-sm text-zinc-700 dark:text-zinc-300 mb-4"><b class="text-indigo-400">Zadanie:</b> ${p.brief}</div>
      <h4 class="font-bold text-sm mb-2">Kontrolný zoznam</h4>
      <div class="space-y-1.5 mb-4">
        ${p.checklist.map((c, i) => `<label class="flex items-start gap-2.5 cursor-pointer text-sm">
          <input type="checkbox" ${st.checks[i] ? 'checked' : ''} onchange="App.projToggleCheck('${pid}',${i});Views.openProject('${pid}')" class="mt-0.5 w-4 h-4 rounded accent-emerald-500">
          <span class="${st.checks[i] ? 'line-through text-zinc-400' : ''}">${c}</span>
        </label>`).join('')}
      </div>
      <h4 class="font-bold text-sm mb-2">Sebahodnotenie</h4>
      <div class="flex gap-1 mb-4">${[1, 2, 3, 4, 5].map(r =>
        `<button onclick="App.projSetRating('${pid}',${r});Views.openProject('${pid}')" class="text-2xl ${st.rating >= r ? '' : 'grayscale opacity-40'}">⭐</button>`).join('')}
        <span class="text-xs text-zinc-500 self-center ml-2">${st.rating ? st.rating + '/5' : 'ohodnoť svoju prácu'}</span></div>
      <h4 class="font-bold text-sm mb-2">Poznámky</h4>
      <textarea onchange="App.projSaveNotes('${pid}',this.value)" rows="4" placeholder="Zisti, čo fungovalo, čo bolo ťažké, čo nabudúce inak…"
        class="w-full rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent p-3 text-sm focus:border-indigo-500 outline-none">${st.notes}</textarea>
      <div class="grid grid-cols-3 gap-2 mt-4">
        <button onclick="App.projSetStatus('${pid}','todo');Views.openProject('${pid}')" class="btn-press py-2 rounded-xl text-xs font-semibold border ${st.status === 'todo' ? 'border-zinc-500 bg-zinc-500/10' : 'border-zinc-300 dark:border-zinc-700'}">○ Nezačatý</button>
        <button onclick="App.projSetStatus('${pid}','progress');Views.openProject('${pid}')" class="btn-press py-2 rounded-xl text-xs font-semibold border ${st.status === 'progress' ? 'border-amber-500 bg-amber-500/10 text-amber-500' : 'border-zinc-300 dark:border-zinc-700'}">⏳ Prebieha</button>
        <button onclick="App.projSetStatus('${pid}','done');Views.openProject('${pid}')" class="btn-press py-2 rounded-xl text-xs font-semibold border ${st.status === 'done' ? 'border-emerald-500 bg-emerald-500/10 text-emerald-500' : 'border-zinc-300 dark:border-zinc-700'}">✓ Dokončený</button>
      </div>
    `, true);
  },

  /* ════════ CERTIFIKÁCIE ════════ */
  certs() {

      ${DATA.certs.map(c => {
        const st = App.state.certs[c.id] || {};
        const ready = App.certReadiness(c);
        const readyColor = ready >= 75 ? '#10b981' : ready >= 45 ? '#f59e0b' : '#ef4444';
        return `<div class="card-hover rounded-2xl border ${st.done ? 'border-emerald-500/40' : 'border-zinc-200 dark:border-zinc-800'} bg-white dark:bg-[#131316] p-5">
          <div class="flex items-start justify-between gap-2 mb-2">
            <h3 class="font-bold text-zinc-900 dark:text-white leading-snug">${st.done ? '✅ ' : '🎓 '}${c.name}</h3>
            ${this.chip(c.difficulty, '#6366f1')}
          </div>
          <p class="text-xs text-zinc-500 mb-3">${c.desc}</p>
          <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs text-zinc-600 dark:text-zinc-400 mb-3">
            <span>📝 ${c.questions}</span><span>⏱ ${c.time}</span>
            <span>🎯 Hranica: ${c.passing}</span><span>📅 Platnosť: ${c.validity}</span>
          </div>
          <div class="mb-3">
            <div class="flex justify-between text-xs mb-1"><span class="text-zinc-500">Pravdepodobnosť úspechu</span><b style="color:${readyColor}">${ready} %</b></div>
            ${this.progressBar(ready, '', 'h-1.5').replace('bg-gradient-to-r from-indigo-500 to-violet-500', '').replace('style="width', `style="background:${readyColor};width`)}
          </div>
          <details class="mb-3">
            <summary class="text-xs font-semibold text-indigo-400 cursor-pointer">Odporúčané znalosti a checklist pripravenosti</summary>
            <ul class="mt-2 space-y-1 text-xs text-zinc-600 dark:text-zinc-400">
              ${c.knowledge.map(k => `<li>• ${k}</li>`).join('')}
            </ul>
            <div class="mt-2 space-y-1 text-xs">
              ${c.checklist.map(k => `<div class="flex gap-1.5"><span class="text-emerald-500">☐</span><span class="text-zinc-600 dark:text-zinc-400">${k}</span></div>`).join('')}
            </div>
          </details>
          <div class="flex gap-2">
            <a href="${c.url}" target="_blank" rel="noopener" class="btn-press flex-1 text-center py-2 rounded-xl text-xs font-semibold border border-zinc-300 dark:border-zinc-700 hover:border-indigo-500 transition">↗ Skillshop</a>
            <button onclick="App.toggleCert('${c.id}')" class="btn-press flex-1 py-2 rounded-xl text-xs font-semibold text-white transition ${st.done ? 'bg-zinc-600 hover:bg-zinc-500' : 'bg-emerald-600 hover:bg-emerald-500'}">
              ${st.done ? 'Zrušiť označenie' : ready >= 75 ? '✓ Som pripravený — splnená!' : 'Označiť ako splnenú'}
            </button>
          </div>
          ${st.done && st.date ? `<div class="text-[10px] text-zinc-500 mt-2">Získaná ${new Date(st.date).toLocaleDateString('sk')} · obnova o 12 mes.</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;

  /* ════════ SLOVNÍK ════════ */
  glossary() {
    return `
    <div class="flex flex-wrap gap-2 mb-4">
      <input id="gl-search" oninput="Views.glFilter()" placeholder="Hľadať pojem…"
        class="flex-1 min-w-[200px] rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent px-4 py-2.5 text-sm outline-none focus:border-indigo-500">
      <select id="gl-cat" onchange="Views.glFilter()" class="rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-[#131316] px-3 py-2.5 text-sm outline-none">
        <option value="">Všetky oblasti</option>
        <option value="ads">Google Ads</option>
        <option value="gbp">GBP / Local</option>
        <option value="gsc">GSC / SEO</option>
      </select>
    </div>
    <div id="gl-list" class="grid md:grid-cols-2 gap-3">${this.glItems(DATA.glossary)}</div>`;
  },
  glItems(items) {
    const colors = { ads: '#f59e0b', gbp: '#10b981', gsc: '#3b82f6' };
    return items.map(g => `
      <div class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316] p-4">
        <div class="flex items-center justify-between mb-1.5">
          <h3 class="font-bold text-zinc-900 dark:text-white">${g.term}</h3>
          ${this.chip(g.cat.toUpperCase(), colors[g.cat])}
        </div>
        <p class="text-sm text-zinc-700 dark:text-zinc-300"><b class="text-emerald-500 text-xs">JEDNODUCHO:</b> ${g.simple}</p>
        <p class="text-xs text-zinc-500 mt-1.5"><b class="text-indigo-400">TECHNICKY:</b> ${g.tech}</p>
      </div>`).join('') || '<p class="text-sm text-zinc-500">Žiadne výsledky.</p>';
  },
  glFilter() {
    const q = document.getElementById('gl-search').value.toLowerCase();
    const cat = document.getElementById('gl-cat').value;
    const items = DATA.glossary.filter(g =>
      (!cat || g.cat === cat) &&
      (!q || g.term.toLowerCase().includes(q) || g.simple.toLowerCase().includes(q) || g.tech.toLowerCase().includes(q)));
    document.getElementById('gl-list').innerHTML = this.glItems(items);
  },

  /* ════════ KARIÉRA ════════ */
  career() {
    const s = App.state;
    // „Čo ovládam" — sekcie s dokončenými všetkými lekciami
    const known = [], toLearn = [];
    DATA.modules.forEach(m => m.sections.forEach(sec => {
      const done = sec.lessons.every(l => s.completedLessons[l.id]);
      (done ? known : toLearn).push({ m, sec });
    }));
    const missingCerts = DATA.certs.filter(c => !(s.certs[c.id] || {}).done);
    return `
    <div class="grid md:grid-cols-2 gap-4 mb-4">
      ${this.card(`
        <h3 class="font-bold text-zinc-900 dark:text-white mb-3">✅ Čo už ovládam</h3>
        ${known.length ? `<div class="space-y-1.5">${known.map(k => `<div class="text-sm flex items-center gap-2"><span style="color:${k.m.color}">●</span> ${k.sec.title} <span class="text-xs text-zinc-500">(${k.m.short})</span></div>`).join('')}</div>`
        : '<p class="text-sm text-zinc-500">Zatiaľ nič dokončené — každá dokončená sekcia sa objaví tu.</p>'}`)}
      ${this.card(`
        <h3 class="font-bold text-zinc-900 dark:text-white mb-3">📚 Čo sa ešte potrebujem naučiť</h3>
        ${toLearn.length ? `<div class="space-y-1.5">${toLearn.slice(0, 10).map(k => `<div class="text-sm flex items-center gap-2 text-zinc-600 dark:text-zinc-400"><span class="opacity-40" style="color:${k.m.color}">○</span> ${k.sec.title} <span class="text-xs text-zinc-500">(${k.m.short})</span></div>`).join('')}${toLearn.length > 10 ? `<div class="text-xs text-zinc-500">…a ďalších ${toLearn.length - 10}</div>` : ''}</div>`
        : '<p class="text-sm font-semibold text-emerald-500">🎉 Všetko dokončené!</p>'}`)}
    </div>

    <h3 class="font-bold text-lg text-zinc-900 dark:text-white mb-3">💼 Pozície, ktoré môžem robiť</h3>
    <div class="grid md:grid-cols-2 gap-4 mb-5">
      ${DATA.career.positions.map(p => {
        const avgReady = Math.round(p.needs.reduce((a, mid) => a + App.moduleProgress(mid), 0) / p.needs.length);
        const ready = avgReady >= 80;
        return `<div class="rounded-2xl border ${ready ? 'border-emerald-500/40' : 'border-zinc-200 dark:border-zinc-800'} bg-white dark:bg-[#131316] p-5">
          <div class="flex items-start justify-between gap-2 mb-1">
            <h4 class="font-bold text-zinc-900 dark:text-white">${p.title}</h4>
            ${this.chip(p.level, ready ? '#10b981' : '#71717a')}
          </div>
          <div class="text-sm font-semibold text-indigo-400 mb-1.5">${p.salary}</div>
          <p class="text-xs text-zinc-500 mb-3">${p.desc}</p>
          <div class="flex justify-between text-xs mb-1"><span class="text-zinc-500">Pripravenosť (${p.needs.map(n => App.getModule(n).short).join(' + ')})</span><b>${avgReady} %</b></div>
          ${this.progressBar(avgReady, ready ? 'from-emerald-500 to-teal-400' : 'from-zinc-400 to-zinc-500', 'h-1.5')}
        </div>`;
      }).join('')}
    </div>

    <div class="grid md:grid-cols-3 gap-4">
      ${this.card(`
        <h3 class="font-bold text-zinc-900 dark:text-white mb-3">🗺️ Kariérny postup</h3>
        <ol class="space-y-2 text-sm">${DATA.career.steps.map((st, i) => `<li class="flex gap-2.5"><span class="w-5 h-5 rounded-full bg-indigo-500/15 text-indigo-400 text-xs font-bold flex items-center justify-center shrink-0">${i + 1}</span><span class="text-zinc-700 dark:text-zinc-300">${st}</span></li>`).join('')}</ol>`)}
      ${this.card(`
        <h3 class="font-bold text-zinc-900 dark:text-white mb-3">📜 Chýbajúce certifikácie</h3>
        ${missingCerts.length ? `<div class="space-y-1.5 text-sm">${missingCerts.map(c => `<div class="flex items-center justify-between gap-2"><span class="text-zinc-700 dark:text-zinc-300 text-xs">${c.name}</span><b class="text-xs shrink-0" style="color:${App.certReadiness(c) >= 75 ? '#10b981' : '#f59e0b'}">${App.certReadiness(c)} %</b></div>`).join('')}</div><button onclick="App.go('certs')" class="mt-3 text-xs text-indigo-400 hover:underline">Prejsť na certifikácie →</button>`
        : '<p class="text-sm font-semibold text-emerald-500">Všetky certifikácie získané! 🏆</p>'}`)}
      ${this.card(`
        <h3 class="font-bold text-zinc-900 dark:text-white mb-3">🚀 Odporúčané ďalšie štúdium</h3>
        <div class="space-y-1.5 text-sm">${DATA.career.extra.map(e => `<div class="flex gap-2 text-zinc-700 dark:text-zinc-300"><span class="text-indigo-400">→</span><span class="text-xs">${e}</span></div>`).join('')}</div>`)}
    </div>`;
  },
