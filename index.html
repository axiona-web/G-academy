<script>
/* ═══════════════════════════════════════════════════════════════════
   INTERVIEW MODE — AI recruiter vedie technický pohovor
   ───────────────────────────────────────────────────────────────────
   3 tracky (PPC / SEO / Full-stack). Recruiter kladie otázky,
   odpovedáš vlastnými slovami, engine hodnotí pokrytie kľúčových
   bodov, ukáže vzorovú odpoveď a na konci dá verdikt + odporúčania.
   S API kľúčom mentora sa dá odpoveď dodatočne konzultovať.
   ═══════════════════════════════════════════════════════════════════ */

DATA.interviewTracks = [
  { id: 'ppc', name: 'PPC Specialist (Google Ads)', icon: '📣', role: 'Junior/Medior PPC pozícia v agentúre',
    questions: [
      { q: 'Vysvetlite, ako funguje aukcia Google Ads a čo je Ad Rank.', kw: ['bid', 'quality', 'kvalit', 'ad rank', 'aukci', 'druh'], model: 'Pri každom vyhľadávaní prebieha aukcia. O poradí rozhoduje Ad Rank ≈ max CPC bid × Quality Score + očakávaný vplyv assets. Nevyhráva najvyšší bid — kvalitná reklama platí menej za lepšiu pozíciu. Reálne platíte len toľko, koľko treba na prekonanie inzerenta pod vami.' },
      { q: 'Klient má e-shop s maržou 30 %. Aký ROAS cieľ mu nastavíte a prečo?', kw: ['break', '333', 'marž', 'roas', 'zisk', '1/0,3'], model: 'Break-even ROAS = 1/marža = 1/0,30 ≈ 333 %. Všetko nad to tvorí zisk. Cieľový tROAS nastavím nad break-even s ohľadom na cieľ: agresívny rast → bližšie k 350–400 %, maximalizácia zisku → vyššie. Zároveň upozorním, že maximalizácia ROAS ≠ maximalizácia zisku.' },
      { q: 'Prevzali ste účet, kde sa 30 % rozpočtu míňa na irelevantné dopyty. Aký je váš postup?', kw: ['search terms', 'negatív', 'match', 'exact', 'phrase', 'zoznam'], model: 'Analýza search terms reportu → identifikácia irelevantných vzorcov → negatívne kľúčové slová (vrátane synoným a tvarov), zdieľaný negatívny zoznam, prehodnotenie match types (broad len so smart biddingom), a týždenná rutina čistenia. Konvertujúce dopyty naopak povýšim na exact.' },
      { q: 'Kedy nasadíte Performance Max a aké sú jeho riziká?', kw: ['feed', 'meranie', 'brand', 'exclusion', 'doplnok', 'search'], model: 'PMax nasadzujem, keď funguje konverzné meranie, existujú kvalitné assets/feed a je vybudovaný Search základ. Riziká: čierna skrinka, pripisovanie brand konverzií (riešim brand exclusions) a závislosť od kvality konverzných dát. PMax je doplnok Search, nie náhrada.' },
      { q: 'Konverzie klienta zo dňa na deň klesli na nulu, útrata beží. Čo robíte?', kw: ['meranie', 'tag', 'test', 'web', 'formulár', 'technik'], model: 'Náhla nula pri bežnej útrate = takmer vždy rozbité meranie, nie trh. Overím konverzný tag (Tag Assistant/GTM preview), funkčnosť webu a formulárov, potom nedávne zmeny (release, consent lišta). Až po vylúčení techniky riešim trh a kampane.' },
      { q: 'Ako vysvetlíte klientovi rozdiel medzi CPA 20 € pri 10 konverziách a CPA 35 € pri 60 konverziách?', kw: ['objem', 'zisk', 'škál', 'marginal', 'absolút', 'celkov'], model: 'Nižšie CPA neznamená lepší biznis. 10×20 € = malý objem; 60 konverzií pri 35 € môže znamenať násobne vyšší celkový zisk, ak je CPA pod hranicou rentability. Škálovanie prirodzene zvyšuje marginálne CPA — optimalizujeme celkový zisk, nie pomerové číslo.' },
      { q: 'Aké kroky spravíte pred spustením kampaní pre úplne nového klienta?', kw: ['discovery', 'marž', 'meranie', 'keyword', 'research', 'cieľ', 'landing'], model: 'Discovery (biznis, marža, hodnota zákazníka → výpočet cieľového CPA/ROAS), keyword research a konkurenčná analýza, nasadenie a otestovanie konverzného merania + Consent Mode, review landing pages, návrh štruktúry (brand/non-brand), nastavenie očakávaní na prvé 3 mesiace.' },
      { q: 'Čo je Quality Score, z čoho sa skladá a ako ho zlepšíte?', kw: ['ctr', 'relevan', 'landing', 'komponent', 'tesn'], model: 'Diagnostické skóre 1–10 z troch komponentov: expected CTR, ad relevance, landing page experience. Zlepšenie podľa slabého komponentu: silnejšie reklamy a presnejšie cielenie (CTR), tesnejšie ad groups s kľúčovým slovom v nadpisoch (relevance), dedikované rýchle landing pages (LP experience).' },
    ]},
  { id: 'seo', name: 'SEO / Technical Specialist', icon: '🔍', role: 'SEO pozícia so zameraním na technické SEO',
    questions: [
      { q: 'Vysvetlite rozdiel medzi crawlingom a indexáciou — a ako do toho vstupuje robots.txt a noindex.', kw: ['crawl', 'index', 'robots', 'noindex', 'blokovan'], model: 'Crawling = sťahovanie stránok Googlebotom; indexácia = zaradenie do indexu. robots.txt riadi crawling (nie indexáciu!) — blokovaná URL sa môže indexovať „naslepo". Na de-indexáciu slúži noindex, pričom stránka nesmie byť blokovaná v robots.txt, inak Google noindex neuvidí.' },
      { q: 'Web po redizajne stratil 40 % organiky. Ako postupujete?', kw: ['redirect', '301', 'mapa', 'url', 'gsc', 'canonical', 'noindex'], model: 'Korelácia s nasadením = hľadám technickú regresiu: zmeny URL bez 301 redirect mapy, zabudnutý noindex z testu, rozbité canonicaly, robots.txt. V GSC kontrolujem Page indexing trendy a 404. Náprava: redirect mapa 1:1, oprava tagov, validácia opráv a monitoring.' },
      { q: 'Čo je „Crawled — currently not indexed" a ako to riešite?', kw: ['kvalit', 'intern', 'odkaz', 'obsah', 'thin', 'duplicit'], model: 'Google stránku stiahol, ale nepovažuje ju za dosť hodnotnú na indexáciu. Riešenie nie je Request indexing dokola, ale zlepšenie kvality a unikátnosti obsahu, interné prelinkovanie z autoritatívnych stránok a konsolidácia duplicít.' },
      { q: 'Vymenujte Core Web Vitals, ich prahové hodnoty a po jednej príčine zlyhania.', kw: ['lcp', 'inp', 'cls', '2,5', '200', '0,1'], model: 'LCP ≤ 2,5 s (pomalé hero obrázky/server), INP ≤ 200 ms (ťažký JavaScript), CLS ≤ 0,1 (obrázky bez rozmerov, naskakujúce bannery). Hodnotí sa na 75. percentile field dát (CrUX) za 28 dní — oprava sa v GSC prejaví až po týždňoch.' },
      { q: 'Kedy použijete canonical a kedy 301 redirect?', kw: ['canonical', '301', 'dostupn', 'duplicit', 'hint', 'trval'], model: 'Canonical: obe verzie majú zostať dostupné používateľom (parametre, varianty) — je to hint pre vyhľadávač. 301: URL má natrvalo zaniknúť v prospech inej — fyzicky presmeruje a prenáša signály. Pri migráciách vždy 301, pri variantoch canonical.' },
      { q: 'Klient sa pýta: „Dostali sme penalizáciu?" — ako to zistíte?', kw: ['manual', 'action', 'gsc', 'algoritm', 'core update', 'správa'], model: 'Manual action = správa v GSC reporte Manual actions — vtedy náprava + reconsideration request. Prázdny report + prepad pri známom core update = algoritmické prehodnotenie, žiadna žiadosť neexistuje — rieši sa kvalitou obsahu a webu. Rozlíšenie týchto dvoch situácií je kľúčové.' },
      { q: 'Ako spravíte technický audit webu — aké oblasti pokryjete?', kw: ['index', 'architekt', 'duplicit', 'cwv', 'odkaz', 'robots', 'priorit'], model: '8 oblastí: indexácia a crawling (robots, sitemap, coverage), architektúra a interné odkazy, duplicity a kanonizácia, obsah, CWV a mobilita, odkazový profil, bezpečnosť a penalizácie. Výstup: nálezy s dôkazmi, prioritizácia dopad × náročnosť, plán 30/60/90 dní.' },
      { q: 'Prečo môže mať stránka vysoké impresie a nízke CTR — a čo s tým?', kw: ['title', 'description', 'pozíci', 'snippet', 'benchmark', 'rich'], model: 'Buď nízka pozícia, alebo slabý snippet. Porovnám CTR s benchmarkom pre danú pozíciu; ak zaostáva, prepíšem title (dopyt + benefit + rok) a description (CTA), zvážim štruktúrované dáta pre rich results. Meriam pred/po na rovnakých dopytoch.' },
    ]},
  { id: 'full', name: 'Digital Specialist (GBP + SEO + Ads)', icon: '🎯', role: 'Full-stack digital pozícia / freelancer pre SME klientov',
    questions: [
      { q: 'Lokálna firma má 200 € mesačne na marketing. Kam ich investujete a prečo?', kw: ['gbp', 'profil', 'recenz', 'zadarmo', 'organ', 'search'], model: 'Najprv bezplatné kanály s najvyššou návratnosťou: kompletná optimalizácia GBP profilu + systém recenzií (najsilnejší lokálny kanál, zadarmo). Zvyšok do malej Search kampane na dopyty s najvyšším intentom. Display/social pri tomto rozpočte nemá zmysel.' },
      { q: 'Vysvetlite tri piliere lokálneho rankingu a ako ich ovplyvníte.', kw: ['relevance', 'distance', 'prominence', 'kategó', 'recenz', 'citáci'], model: 'Relevance (kategórie, kompletnosť profilu, obsah webu), Distance (neovplyvním — riadi realita polohy), Prominence (recenzie, citácie, autorita webu, PR). Prakticky: správna primárna kategória + systém recenzií + konzistentné NAP + lokálne landing pages.' },
      { q: 'Klient chce „byť prvý na Google". Ako s ním vediete rozhovor?', kw: ['očakáv', 'dopyt', 'cieľ', 'biznis', 'konkrét', 'metrik'], model: 'Preformulujem cieľ z pozície na biznis výsledok: „prvý na čo, pre koho a čo to prinesie?" Vysvetlím rozdiel SEO/Ads/lokálne výsledky, reálne časové rámce a navrhnem merateľné KPI (dopyty, hovory, objednávky). Sľubovanie pozícií je červená vlajka neprofesionála.' },
      { q: 'Aká je synergia medzi GBP a Google Ads pre lokálnu firmu?', kw: ['location', 'asset', 'prepoj', 'call', 'lokáln', 'maps'], model: 'Prepojenie GBP ↔ Ads odomyká location assets (adresa, hodnotenie, vzdialenosť pri reklame) a reklamy na Maps. Call assets + call konverzie merajú hovory. Organický profil zvyšuje dôveru pri brandovom overovaní po kliku na reklamu — kanály sa násobia, nie sčítavajú.' },
      { q: 'Firma dostala vlnu falošných 1★ recenzií od konkurencie. Postup?', kw: ['nahlás', 'konflikt', 'odpove', 'redressal', 'dôkaz', 'reviews management'], model: 'Recenzie od konkurencie = konflikt záujmov → nahlásiť (profil + Reviews Management Tool), doložiť vzorec (časová vlna, žiadni reálni zákazníci). Súbežne verejne profesionálne odpovedať pre budúcich zákazníkov a posilniť prísun reálnych recenzií, ktoré vlnu rozriedia.' },
      { q: 'Ako by ste merali úspešnosť GBP profilu a reportovali ju klientovi?', kw: ['interakc', 'volan', 'tras', 'utm', 'discovery', 'vanity'], model: 'Interakcie > zobrazenia: hovory, žiadosti o trasu, kliky na web (s UTM do GA4), rezervácie. Pomer discovery vs. brand dopytov ukazuje získavanie nových zákazníkov. Mesačný report: viditeľnosť, akcie, recenzie (počet/priemer/response rate) + vykonané práce. Zobrazenia sú vanity metrika.' },
      { q: 'Klient má web, GBP aj kampane — všetko priemerné. Kde začnete a prečo?', kw: ['audit', 'quick win', 'dopad', 'priorit', 'meranie', 'dáta'], model: 'Trojitý audit (GBP, web/GSC, Ads) → matica dopad × náročnosť → quick wins najprv (typicky: meranie konverzií, GBP kategórie a recenzie, negatívne slová). Bez auditu nezačínam nič „vylepšovať" — priority musia vychádzať z dát, nie dojmov.' },
      { q: 'Ako si udržiavate odbornosť v rýchlo sa meniacom Google ekosystéme?', kw: ['blog', 'test', 'komunita', 'oficiál', 'experiment', 'zdroje'], model: 'Oficiálne zdroje (Google Ads & Search Central blogy, release notes), overené komunity a newslettre, a hlavne vlastné experimenty na účtoch — zmeny najprv testujem, potom škálujem. Certifikácie obnovujem ročne; kľúčová je prax, nie teória.' },
    ]},
];

const Interview = {
  session: null, // { track, idx, scores[], answers[] }
  start(trackId) {
    const track = DATA.interviewTracks.find(t => t.id === trackId);
    this.session = { track, idx: 0, scores: [], answers: [] };
    this.renderQ();
  },
  renderQ(feedback) {
    const s = this.session;
    if (s.idx >= s.track.questions.length) { this.finish(); return; }
    const q = s.track.questions[s.idx];
    App.modal(`
      <div class="flex items-center justify-between mb-3">
        <div><h3 class="font-bold text-zinc-900 dark:text-white">🎙️ Pohovor: ${s.track.name}</h3>
        <div class="text-xs text-zinc-500">Otázka ${s.idx + 1}/${s.track.questions.length}</div></div>
        <button onclick="Interview.session=null;App.closeModal()" class="text-zinc-400 hover:text-red-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      ${Views.progressBar((s.idx + 1) / s.track.questions.length * 100, 'from-sky-500 to-cyan-400', 'h-1.5')}
      ${feedback || ''}
      <div class="rounded-2xl bg-zinc-100 dark:bg-zinc-800/70 p-4 text-sm text-zinc-800 dark:text-zinc-200 my-4">
        <b>Recruiter:</b> „${q.q}"
      </div>
      <textarea id="iv-input" rows="5" placeholder="Odpovedz ako na skutočnom pohovore — štruktúrovane, s konkrétnymi pojmami a príkladmi…"
        class="w-full rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent p-3 text-sm outline-none focus:border-sky-500 mb-3"></textarea>
      <button onclick="Interview.answer()" class="btn-press w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-semibold">Odpovedať</button>
    `, true);
    if (window.lucide) lucide.createIcons();
  },
  answer() {
    const s = this.session;
    const text = (document.getElementById('iv-input').value || '').trim();
    if (text.length < 30) { App.toast('✍️ Rozveď odpoveď', 'na pohovore jednoslovná odpoveď neobstojí', ''); return; }
    const q = s.track.questions[s.idx];
    const t = text.toLowerCase();
    const hits = q.kw.filter(k => t.includes(k)).length;
    const score = Math.min(100, Math.round(hits / Math.min(4, q.kw.length) * 70) + (text.length > 200 ? 30 : text.length > 100 ? 20 : 10));
    s.scores.push(score);
    s.answers.push(text);
    const fb = `
      <div class="rounded-xl border ${score >= 70 ? 'border-emerald-500/30 bg-emerald-500/5' : score >= 40 ? 'border-amber-500/30 bg-amber-500/5' : 'border-red-500/30 bg-red-500/5'} p-3 mt-3 text-xs">
        <div class="font-bold mb-1 ${score >= 70 ? 'text-emerald-500' : score >= 40 ? 'text-amber-500' : 'text-red-400'}">
          ${score >= 70 ? '✅ Silná odpoveď' : score >= 40 ? '🟡 Priemerná odpoveď' : '🔴 Slabá odpoveď'} (${score}/100) — pokryl si ${hits}/${q.kw.length} kľúčových bodov
        </div>
        <div class="text-zinc-600 dark:text-zinc-400"><b>Vzorová odpoveď seniora:</b> ${q.model}</div>
      </div>`;
    s.idx++;
    this.renderQ(fb);
  },
  finish() {
    const s = this.session;
    const avg = Math.round(s.scores.reduce((a, b) => a + b, 0) / s.scores.length);
    const verdict = avg >= 75 ? ['🏆 Odporúčanie: PRIJAŤ', 'Odpovedal si na úrovni skúseného špecialistu. S portfóliom projektov z tejto akadémie máš na pohovore silnú pozíciu.', '#10b981']
      : avg >= 50 ? ['🤝 Odporúčanie: DRUHÉ KOLO', 'Základy máš, chýba hĺbka v niektorých témach. Prejdi si vzorové odpovede a zopakuj slabšie oblasti.', '#f59e0b']
      : ['📚 Odporúčanie: EŠTE TRÉNOVAŤ', 'Na reálny pohovor je priskoro — vráť sa k modulom, ktoré pokrývajú otázky s najnižším skóre.', '#ef4444'];
    App.state.interviews.push({ track: s.track.id, avg, date: Date.now() });
    App.save();
    App.addXP(40 + Math.round(avg / 2), 'Interview Mode');
    const weakest = s.track.questions.map((q, i) => ({ q: q.q, sc: s.scores[i] })).sort((a, b) => a.sc - b.sc).slice(0, 3);
    App.modal(`
      <div class="text-center mb-4">
        <div class="text-4xl mb-2">🎙️</div>
        <h3 class="font-bold text-lg text-zinc-900 dark:text-white">Pohovor dokončený — ${avg}/100</h3>
        <div class="font-bold mt-1" style="color:${verdict[2]}">${verdict[0]}</div>
        <p class="text-sm text-zinc-500 mt-1">${verdict[1]}</p>
      </div>
      <h4 class="font-bold text-sm mb-2">Skóre po otázkach</h4>
      <div class="space-y-1 mb-4">${s.scores.map((sc, i) => `
        <div class="flex items-center gap-2 text-xs"><span class="w-6 text-zinc-500">${i + 1}.</span>
        <div class="flex-1 h-1.5 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full" style="background:${sc >= 70 ? '#10b981' : sc >= 40 ? '#f59e0b' : '#ef4444'};width:${sc}%"></div></div>
        <b class="w-8 text-right">${sc}</b></div>`).join('')}</div>
      <div class="rounded-xl bg-sky-500/10 border border-sky-500/20 p-3 text-xs mb-4">
        <b class="text-sky-400">Na zlepšenie:</b>
        <ul class="mt-1 space-y-0.5 text-zinc-600 dark:text-zinc-400">${weakest.map(w => `<li>• ${w.q} <b>(${w.sc}/100)</b></li>`).join('')}</ul>
      </div>
      <button onclick="Interview.session=null;App.closeModal();App.render()" class="btn-press w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-semibold">Zavrieť</button>
    `, true);
    this.session = null;
  },
};

/* ═══════════════ VIEW: POHOVOR ═══════════════ */
Views.interview = function () {
  const hist = App.state.interviews || [];
  return `
  <p class="text-sm text-zinc-500 mb-4">🎙️ AI recruiter s tebou povedie technický pohovor — 8 otázok, odpovedáš vlastnými slovami, po každej odpovedi vidíš vzorovú odpoveď seniora. Na konci dostaneš verdikt ako z reálneho výberového konania.</p>
  <div class="grid md:grid-cols-3 gap-4">
    ${DATA.interviewTracks.map(t => {
      const best = hist.filter(h => h.track === t.id).sort((a, b) => b.avg - a.avg)[0];
      return `<div class="card-hover rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#131316] p-5 flex flex-col">
        <div class="text-3xl mb-2">${t.icon}</div>
        <h3 class="font-bold text-zinc-900 dark:text-white">${t.name}</h3>
        <p class="text-xs text-zinc-500 mt-1 mb-3 flex-1">${t.role} · ${t.questions.length} otázok</p>
        ${best ? `<div class="text-xs mb-2">Najlepší výsledok: <b style="color:${best.avg >= 75 ? '#10b981' : '#f59e0b'}">${best.avg}/100</b></div>` : ''}
        <button onclick="Interview.start('${t.id}')" class="btn-press w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-sm font-semibold">Začať pohovor</button>
      </div>`;
    }).join('')}
  </div>
  ${hist.length ? `<div class="mt-4">${this.card(`
    <h3 class="font-bold text-sm text-zinc-900 dark:text-white mb-2">História pohovorov</h3>
    <div class="space-y-1">${[...hist].reverse().slice(0, 8).map(h => {
      const t = DATA.interviewTracks.find(x => x.id === h.track);
      return `<div class="flex items-center gap-3 text-sm py-1.5 border-b border-zinc-100 dark:border-zinc-800/60 last:border-0">
        <span>${t.icon}</span><span class="flex-1">${t.name}</span>
        <span class="text-xs text-zinc-500">${new Date(h.date).toLocaleDateString('sk')}</span>
        <b class="text-xs" style="color:${h.avg >= 75 ? '#10b981' : h.avg >= 50 ? '#f59e0b' : '#ef4444'}">${h.avg}/100</b></div>`;
    }).join('')}</div>`)}</div>` : ''}`;
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   QUALITY & CONTENT OPS — verziovanie obsahu, admin editor,
   logovanie chýb a hlásenie chýb v obsahu
   ───────────────────────────────────────────────────────────────────
   • Content overrides: úpravy lekcií/otázok sa neukladajú do kódu,
     ale ako "override" záznamy (Supabase tabuľka content_overrides;
     v lokálnom režime localStorage). Pri štarte sa aplikujú na DATA.
   • Admin editor: úprava lekcie/otázky bez zásahu do kódu, história
     posledných verzií, deaktivácia otázok, označenie „v revízii".
   • Error logging: window.onerror → lokálny buffer + Supabase.
   ═══════════════════════════════════════════════════════════════════ */

/* Globálne metadáta obsahu (verzia kurzu) */
DATA.contentMeta = { version: '2.1.0', released: '2026-07-26', source: 'G-Academy tím' };

const Content = {
  overrides: {},   // { id: {data, note, updated_at, updated_by, history} }
  LKEY: 'gacademy_overrides',

  /* ── Načítanie overridov (Supabase alebo localStorage) ── */
  async load() {
    try {
      if (Auth.sb && Auth.user) {
        const { data } = await Auth.sb.from('content_overrides').select('*');
        (data || []).forEach(r => this.overrides[r.id] = r);
      } else {
        this.overrides = JSON.parse(localStorage.getItem(this.LKEY) || '{}');
      }
    } catch (e) { this.overrides = {}; }
    this.apply();
  },

  /* Nájdi ORIGINÁL lekcie v DATA.modules — App.getLesson vracia kópie
     (spread v allLessons), mutácia kópie by sa stratila pri resete cache */
  origLesson(id) {
    for (const m of DATA.modules) for (const sec of m.sections) {
      const l = sec.lessons.find(x => x.id === id);
      if (l) return l;
    }
    return null;
  },

  /* ── Aplikovanie overridov na zabudovaný obsah ── */
  apply() {
    Object.entries(this.overrides).forEach(([id, row]) => {
      const d = row.data || row; // localStorage ukladá priamo data
      if (id.startsWith('lesson:')) {
        const l = this.origLesson(id.slice(7));
        if (!l) return;
        if (d.title) l.title = d.title;
        if (d.min) l.min = d.min;
        if (d.theory) l.theory = d.theory;
        if (Array.isArray(d.checklist)) l.checklist = d.checklist;
        l._rev = { date: row.updated_at || d._date, by: row.updated_by, outdated: !!d.outdated, note: row.note };
      } else if (id.startsWith('quiz:')) {
        const [, lid, qi] = id.split(':');
        const l = this.origLesson(lid);
        const q = l && l.quiz[+qi];
        if (!q) return;
        if (d.q) q.q = d.q;
        if (Array.isArray(d.o)) q.o = d.o;
        if (typeof d.c === 'number') q.c = d.c;
        if (d.e) q.e = d.e;
        q._disabled = !!d.disabled;
      }
    });
    /* Deaktivované otázky vyraď z kvízových poolov (lekcia si drží pôvodné pole
       pre editor, testový engine filtruje cez helper) */
    App._all = null; // reset cache lekcií
  },
  activeQuiz(lesson) { return lesson.quiz.filter(q => !q._disabled); },

  /* ── Uloženie override (admin) ── */
  async save(id, data, note) {
    const prev = this.overrides[id];
    const history = (prev?.history || []).slice(-4);
    if (prev) history.push({ date: prev.updated_at, by: prev.updated_by, data: prev.data });
    const row = { id, data, note: note || '', history, updated_by: Auth.user?.email || 'local-admin', updated_at: new Date().toISOString() };
    this.overrides[id] = row;
    if (Auth.sb && Auth.user) {
      const { error } = await Auth.sb.from('content_overrides').upsert(row);
      if (error) { App.toast('⚠️ Uloženie zlyhalo', error.message, ''); return false; }
    } else {
      localStorage.setItem(this.LKEY, JSON.stringify(this.overrides));
    }
    this.apply();

const ErrLog = {
  buffer: [],
  init() {
    this.buffer = JSON.parse(localStorage.getItem('gacademy_errors') || '[]');
    window.addEventListener('error', e => this.log('js-error', e.message, (e.filename || '') + ':' + e.lineno));
    window.addEventListener('unhandledrejection', e => this.log('js-error', 'Promise: ' + (e.reason?.message || e.reason), ''));
  },
  log(kind, message, detail) {
    const entry = { kind, message: String(message).slice(0, 300), detail: String(detail).slice(0, 300), date: Date.now() };
    this.buffer.push(entry);
    this.buffer = this.buffer.slice(-30);
    try { localStorage.setItem('gacademy_errors', JSON.stringify(this.buffer)); } catch (e) {}
    // Online: pošli do Supabase (admin ich vidí v Admin sekcii)
    if (Auth.sb && Auth.user) {
      Auth.sb.from('error_logs').insert({ user_id: Auth.user.id, kind, message: entry.message, detail: entry.detail, url: location.hash || '' }).then(() => {}, () => {});
    }
  },
};
ErrLog.init();

<script>
/* ═══════════════════════════════════════════════════════════════════
   LEARNING v2 — adaptívny mastery algoritmus, bezpečná AI proxy,
   časovo obmedzené praktické prípady, história auditov
   ═══════════════════════════════════════════════════════════════════ */

/* ── MASTERY v2 ──────────────────────────────────────────────────
   Vážený vzorec (podľa produktovej špecifikácie):
     30 % testové otázky · 20 % spaced repetition · 25 % praktické
     úlohy · 15 % simulácie · 10 % časová stabilita vedomostí
   Poistka: bez praxe a simulácií je mastery zastropované na 70 % —
   „náhodne trafených 10 otázok" nikdy neznamená 100 %. */
Engine.masteryV2 = true;
Engine.mastery = function (topic) {
  const s = App.state;
  /* 1) Testy (30 %): dokončené lekcie + najlepšie kvízy tém */
  let doneL = 0, quizSum = 0, quizN = 0, lastActivity = 0;
  topic.lessons.forEach(id => {
    if (s.completedLessons[id]) { doneL++; lastActivity = Math.max(lastActivity, s.completedLessons[id]); }
    const q = s.quizResults['lesson:' + id];
    if (q) { quizSum += q.score / q.total; quizN++; lastActivity = Math.max(lastActivity, q.date || 0); }
  });
  const tests = (doneL / topic.lessons.length * 0.4 + (quizN ? quizSum / quizN : 0) * 0.6);

  /* 2) Spaced repetition (20 %): kartičky modulu témy */
  const modCards = DATA.flashcards.filter(c => c.mod === topic.mod);
  const sr = modCards.length ? modCards.reduce((a, c) => {
    const st = s.flashcards[c.id];
    return a + (st && st.reps > 0 ? Math.min(1, st.reps / 3 * (st.ease / 2.5)) : 0);
  }, 0) / modCards.length : 0;

  /* 3) Praktické úlohy (25 %): projekty modulu + audity (pre GBP/GSC témy) */
  const modProjects = DATA.projects.filter(p => p.module === topic.mod);
  const projDone = modProjects.filter(p => (s.projects[p.id] || {}).status === 'done').length;
  const auditBonus = (s.audits || []).some(a => (topic.mod === 'gsc' && a.type === 'web') || (topic.mod === 'gbp' && a.type === 'gbp')) ? 0.3 : 0;
  const practical = Math.min(1, (modProjects.length ? projDone / modProjects.length : 0) + auditBonus);

  /* 4) Simulácie (15 %): roleplay + master projekty + časové prípady */
  const masterScores = Object.values(s.master || {}).filter(m => m.done);
  const masterAvg = masterScores.length ? masterScores.reduce((a, m) => a + m.score / 10, 0) / masterScores.length : 0;
  const casesDone = (s.cases || []).filter(c => c.mod === topic.mod);
  const caseAvg = casesDone.length ? casesDone.reduce((a, c) => a + c.pct / 100, 0) / casesDone.length : 0;
  const sims = Math.min(1, (s.roleplaysDone || 0) * 0.12 + masterAvg * 0.5 + caseAvg * 0.5);

  /* 5) Časová stabilita (10 %): čerstvosť poslednej aktivity v téme */
  const days = lastActivity ? (Date.now() - lastActivity) / 864e5 : 999;
  const stability = lastActivity ? Math.max(0, 1 - days / 60) : 0;

  let m = (tests * 30 + sr * 20 + practical * 25 + sims * 15 + stability * 10);
  /* Poistka: len teória bez praxe/simulácií = strop 70 % */
  if (practical === 0 && sims === 0) m = Math.min(m, 70);
  return Math.round(Math.min(100, m));
};

/* ── BEZPEČNÁ AI PROXY (Supabase Edge Function) ──────────────────
   API kľúč žije na serveri. Klient volá funkciu s JWT prihláseného
   používateľa. Lokálny kľúč zostáva len ako experimentálny fallback. */
Auth.aiProxyAvailable = function () { return !!(this.sb && this.user); };
Auth.aiProxy = async function (message, system) {
  const { data: { session } } = await this.sb.auth.getSession();
  const r = await fetch(GACADEMY_CONFIG.SUPABASE_URL + '/functions/v1/ai-mentor', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + session.access_token },
    body: JSON.stringify({ message, system }),
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d.text;
};

/* Mentor: nová priorita — 1) serverová proxy, 2) lokálny kľúč
   (experiment s upozornením), 3) offline engine */
Views.mentorSend = async function () {
  const input = document.getElementById('mentor-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  this.mentorPush('user', this.esc(text));
  const sys = `Študent: progres ${App.overallProgress()} %, level ${App.level().name}, moduly: ${DATA.modules.map(m => m.short + ':' + App.moduleProgress(m.id) + '%').join(', ')}. Najslabšie témy: ${Engine.weakest(3).map(w => w.name + ' ' + w.m + '%').join(', ') || 'zatiaľ žiadne dáta'}.`;
  if (Auth.aiProxyAvailable()) {
    this.mentorPush('ai', '<span class="opacity-60">Premýšľam…</span>');
    try {
      const reply = await Auth.aiProxy(text, sys);
      App.state.mentorHistory.pop();
      this.mentorPush('ai', this.esc(reply).replace(/\n/g, '<br>'));
    } catch (e) {
      App.state.mentorHistory.pop();
      this.mentorPush('ai', `⚠️ AI proxy: ${this.esc(e.message)}<br>Prepínam na offline režim:<br><br>` + this.mentorEngine(text.toLowerCase(), text));
    }
    return;
  }
  if (App.state.apiKey) {
    this.mentorPush('ai', '<span class="opacity-60">Premýšľam…</span>');
    const reply = await this.mentorAPI(text);
    App.state.mentorHistory.pop();
    this.mentorPush('ai', reply);
    return;
  }
  setTimeout(() => this.mentorPush('ai', this.mentorEngine(text.toLowerCase(), text)), 350);
};

const Cases = {
  session: null, timer: null,
  start(id) {
    const c = DATA.cases.find(x => x.id === id);
    const shuffled = App.sample(c.steps.map((s, i) => ({ s, i })), c.steps.length);
    this.session = { c, shuffled, picked: [], startedAt: Date.now(), endsAt: Date.now() + c.limit * 1000 };
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      const el = document.getElementById('case-timer');
      if (!this.session) { clearInterval(this.timer); return; }
      const left = Math.max(0, Math.round((this.session.endsAt - Date.now()) / 1000));
      if (el) { el.textContent = '⏱ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); el.className = left < 60 ? 'text-sm font-bold text-red-500' : 'text-sm font-bold text-zinc-500'; }
      if (left <= 0) { App.toast('⏱ Čas vypršal!', 'Vyhodnocujem doterajší výber', ''); this.finish(); }
    }, 1000);
    this.render();
  },
  render() {
    const s = this.session;
    App.modal(`
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold text-zinc-900 dark:text-white">⏱ ${s.c.title}</h3>
        <span id="case-timer" class="text-sm font-bold text-zinc-500">⏱ …</span>
      </div>
      <p class="text-sm text-zinc-600 dark:text-zinc-400 rounded-xl bg-zinc-100 dark:bg-zinc-800/70 p-3 mb-3">${s.c.scenario}</p>
      <div class="text-xs text-zinc-500 mb-2">Vybrané kroky (${s.picked.length}/5) — poradie rozhoduje:</div>
      <div class="space-y-1 mb-3 min-h-[40px]">${s.picked.map((pi, n) => `
        <div class="flex items-center gap-2 text-xs rounded-lg bg-indigo-500/10 px-2.5 py-1.5"><b class="text-indigo-400">${n + 1}.</b> ${s.c.steps[pi][0]}
        <button onclick="Cases.unpick(${n})" class="ml-auto text-red-400">✕</button></div>`).join('')}</div>
      <div class="space-y-1.5">${s.shuffled.filter(x => !s.picked.includes(x.i)).map(x => `
        <button onclick="Cases.pick(${x.i})" ${s.picked.length >= 5 ? 'disabled' : ''} class="btn-press w-full text-left px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 hover:border-indigo-500 text-xs transition ${s.picked.length >= 5 ? 'opacity-40' : ''}">${x.s[0]}</button>`).join('')}</div>
      <button onclick="Cases.finish()" ${s.picked.length < 5 ? 'disabled' : ''} class="btn-press w-full mt-4 py-3 rounded-xl font-semibold text-white ${s.picked.length < 5 ? 'bg-zinc-400 dark:bg-zinc-700' : 'bg-emerald-600 hover:bg-emerald-500'}">Odovzdať riešenie</button>
    `, true);
  },
  pick(i) { if (this.session.picked.length < 5) { this.session.picked.push(i); this.render(); } },
  unpick(n) { this.session.picked.splice(n, 1); this.render(); },
  finish() {
    const s = this.session;
    if (!s) return;
    clearInterval(this.timer);
    const c = s.c;
    const vals = s.picked.map(i => c.steps[i][1]);
    const raw = vals.reduce((a, b) => a + b, 0);
    const maxRaw = [...c.steps.map(x => x[1])].sort((a, b) => b - a).slice(0, 5).reduce((a, b) => a + b, 0);
    const orderBonus = s.picked[0] === c.bestFirst ? 1 : 0;
    const timeUsed = (Date.now() - s.startedAt) / 1000;
    const timeBonus = timeUsed < c.limit / 2 && raw > 0 ? 1 : 0;
    const harmful = s.picked.filter(i => c.steps[i][1] < 0);
    const pct = Math.max(0, Math.round((raw + orderBonus + timeBonus) / (maxRaw + 2) * 100));
    App.state.cases = App.state.cases || [];
    App.state.cases.push({ id: c.id, mod: c.mod, pct, date: Date.now() });
    App.save();
    App.addXP(20 + Math.round(pct / 2), 'Časový prípad: ' + c.title);
    const ideal = c.steps.map((st, i) => ({ st, i })).filter(x => x.st[1] === 2);
    this.session = null;
    App.modal(`
      <div class="text-center mb-3"><div class="text-4xl">${pct >= 75 ? '🏆' : pct >= 50 ? '👍' : '📚'}</div>
      <h3 class="font-bold text-lg text-zinc-900 dark:text-white">${c.title}: ${pct} %</h3>
      <div class="text-xs text-zinc-500">výber ${raw}/${maxRaw} b. · prvý krok ${orderBonus ? '✓ správny' : '✗ (+0)'} · čas ${timeBonus ? '✓ bonus' : Math.round(timeUsed / 60) + ' min'}</div></div>
      ${harmful.length ? `<div class="rounded-xl bg-red-500/10 border border-red-500/20 p-3 text-xs mb-3"><b class="text-red-400">⚠️ Škodlivé zásahy (${harmful.length}):</b> ${harmful.map(i => c.steps[i][0]).join(' · ')} — takéto kroky v praxi poškodzujú účet alebo profil klienta.</div>` : ''}
      <div class="rounded-xl bg-emerald-500/10 border border-emerald-500/20 p-3 text-xs mb-4">
        <b class="text-emerald-500">Referenčný postup seniora:</b>
        <ol class="mt-1 space-y-0.5 list-decimal pl-4">${ideal.map(x => `<li>${x.st[0]}</li>`).join('')}</ol>
      </div>
      <button onclick="App.closeModal();App.go('tests')" class="btn-press w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Zavrieť</button>`, true);
  },
};

/* ── HISTÓRIA AUDITOV: porovnanie s predchádzajúcim behom ────────

      texty „Ako na to" a „Očakávaný prínos" = <b>odporúčania</b> na základe best practices.</div>`;
    if (prev) {
      const prevNames = new Set(prev.recs.map(r => r.name));
      const curNames = new Set(a.recs.map(r => r.name));
      const resolved = [...prevNames].filter(n => !curNames.has(n));
      const added = [...curNames].filter(n => !prevNames.has(n));
      const diff = a.overall - prev.overall;
      extra = `<div class="rounded-xl border-2 ${diff >= 0 ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-red-500/30 bg-red-500/5'} p-3 mt-3 text-sm">
        <b>📈 Porovnanie s auditom z ${new Date(prev.date).toLocaleDateString('sk')}:</b>
        <div class="grid grid-cols-4 gap-2 mt-2 text-center text-xs">
          <div><b class="text-lg block">${prev.overall}</b>predtým</div>
          <div><b class="text-lg block">${a.overall}</b>teraz</div>
          <div><b class="text-lg block ${diff >= 0 ? 'text-emerald-500' : 'text-red-400'}">${diff >= 0 ? '+' : ''}${diff}</b>zmena</div>
          <div><b class="text-lg block text-emerald-500">${resolved.length}</b>vyriešené</div>
        </div>
        ${resolved.length ? `<div class="text-xs mt-2 text-emerald-600 dark:text-emerald-400">✓ Vyriešené: ${resolved.slice(0, 4).join(' · ')}${resolved.length > 4 ? '…' : ''}</div>` : ''}
        ${added.length ? `<div class="text-xs mt-1 text-amber-600 dark:text-amber-500">+ Nové nálezy: ${added.slice(0, 3).join(' · ')}</div>` : ''}
      </div>` + extra;
    }
    el.querySelector('div').insertAdjacentHTML('beforeend', extra);

<script>
/* ═══════════════════════════════════════════════════════════════════
   SPRINT 1 — MERANIE KVALITY
   ───────────────────────────────────────────────────────────────────
   1) Track: produktové eventy (lokálny buffer + Supabase events)
   2) QStats: analytika otázok + pravidlá slabých otázok
   3) Onboarding diagnostika: cieľ, skúsenosti, vstupný test → cesta
   4) Confidence score pre mastery (low/medium/high)
   5) Obsahové statusy (Draft → Expert reviewed → Deprecated)
   6) Export / obnova / vymazanie progresu
   7) Validačná vrstva admin editora
   8) Admin: analytika + problémové otázky + anomálie XP
   Implementované prevažne cez wrappery existujúcich funkcií —
   pôvodné moduly zostávajú nezmenené (menší risk regresie).
   ═══════════════════════════════════════════════════════════════════ */

/* ══ 1) PRODUKTOVÉ EVENTY ══ */
const Track = {
  buffer: [],
  log(name, props = {}) {
    const e = { name, props, date: Date.now() };
    this.buffer.push(e);
    this.buffer = this.buffer.slice(-500);
    try { localStorage.setItem('gacademy_events', JSON.stringify(this.buffer.slice(-200))); } catch (x) {}
    if (Auth.sb && Auth.user) {
      Auth.sb.from('events').insert({ user_id: Auth.user.id, name, props }).then(() => {}, () => {});
    }
    QStats.onEvent(name, props);
  },
  init() { try { this.buffer = JSON.parse(localStorage.getItem('gacademy_events') || '[]'); } catch (e) { this.buffer = []; } },
};
Track.init();

/* ══ 2) ANALYTIKA OTÁZOK (kalibrácia) ══
   Per otázka (kľúč = lessonId:index): pokusy, správne, zmeny odpovede,
   priemerný čas. Pravidlá slabej otázky:
   • úspešnosť > 95 % (príliš ľahká) alebo < 30 % (nejasná/ťažká)
   • veľa zmien odpovede (nejednoznačné možnosti)
   • nahlásenia používateľov */
const QStats = {
  data: {},
  init() { try { this.data = JSON.parse(localStorage.getItem('gacademy_qstats') || '{}'); } catch (e) { this.data = {}; } },
  save() { try { localStorage.setItem('gacademy_qstats', JSON.stringify(this.data)); } catch (e) {} },
  rec(src) { if (!this.data[src]) this.data[src] = { n: 0, ok: 0, chg: 0, ms: 0 }; return this.data[src]; },
  onEvent(name, props) {
    if (name === 'question_answered' && props.src) {
      const r = this.rec(props.src);
      r.n++; if (props.correct) r.ok++;
      if (props.ms) r.ms = Math.round((r.ms * (r.n - 1) + props.ms) / r.n);
      this.save();
    }
    if (name === 'answer_changed' && props.src) { this.rec(props.src).chg++; this.save(); }
  },
  /* Zoznam problémových otázok pre admina */
  flagged() {
    const out = [];
    Object.entries(this.data).forEach(([src, r]) => {
      if (r.n < 5) return; // málo dát — nehodnotiť
      const rate = r.ok / r.n;
      const flags = [];
      if (rate > 0.95) flags.push('príliš ľahká (' + Math.round(rate * 100) + '% úspešnosť)');
      if (rate < 0.30) flags.push('nejasná/príliš ťažká (' + Math.round(rate * 100) + '%)');
      if (r.chg / r.n > 0.5) flags.push('časté zmeny odpovede (nejednoznačné možnosti?)');
      if (flags.length) {
        const [lid, qi] = [src.slice(0, src.lastIndexOf(':')), +src.slice(src.lastIndexOf(':') + 1)];
        const l = App.getLesson(lid);
        out.push({ src, lesson: l ? l.title : lid, q: l ? (l.quiz[qi]?.q || '') : '', n: r.n, rate: Math.round(rate * 100), flags });
      }
    });
    return out.sort((a, b) => a.rate - b.rate);
  },
};
QStats.init();

/* ── Wrappery: napojenie eventov na existujúce funkcie ── */
(() => {
  const wrap = (obj, fn, before, after) => {
    const orig = obj[fn].bind(obj);
    obj[fn] = function (...a) { if (before) before(...a); const r = orig(...a); if (after) after(r, ...a); return r; };
  };
  wrap(App, 'completeLesson', (id) => Track.log('lesson_completed', { id }));
  wrap(App, 'go', (view, params) => { if (view === 'lesson' && params?.id) Track.log('lesson_started', { id: params.id }); });
  wrap(App, 'startQuiz', (type, refId) => {
    Track.log(type === 'cert' || type === 'internal' ? 'certification_started' : 'quiz_started', { type, refId });
    App._qStart = Date.now();
  });
  wrap(App, 'answerQuiz', (optIdx) => {
    const q = App.quiz; if (!q) return;
    if (q.answers[q.idx] !== null && q.answers[q.idx] !== optIdx) Track.log('answer_changed', { src: q.questions[q.idx].src });
  });
  wrap(App, 'finishQuiz', null, () => {
    const q = App.quiz; if (!q || !q.finished) return;
    const ms = App._qStart ? Math.round((Date.now() - App._qStart) / q.questions.length) : 0;
    q.questions.forEach((question, i) => Track.log('question_answered', { src: question.src, correct: q.answers[i] === question.c, ms }));
    const pct = q.score / q.questions.length;
    Track.log(pct >= 0.8 ? 'quiz_completed' : 'quiz_failed', { id: q.quizId, pct: Math.round(pct * 100) });
    if (q.type === 'internal' && pct >= 0.8) Track.log('certification_passed', { id: q.refId });
  });
  wrap(Views, 'fcGrade', (g) => Track.log('flashcard_repeated', { grade: g }));
  wrap(Roleplay, 'start', (cid) => Track.log('simulation_started', { kind: 'roleplay', cid }));
  wrap(Cases, 'start', (id) => Track.log('simulation_started', { kind: 'case', id }));
  wrap(Auditor, 'runGbpAudit', null, () => Track.log('audit_created', { type: 'gbp' }));
  wrap(Auditor, 'buildReport', (a) => Track.log('report_exported', { type: a?.type }));
  wrap(Views, 'mentorSend', () => Track.log('mentor_used', {}));
  wrap(ErrLog, 'log', (kind, message) => { if (kind === 'content-report') Track.log('error_reported', { message: String(message).slice(0, 100) }); });
  const origWeb = Auditor.runWebAudit.bind(Auditor);
  Auditor.runWebAudit = async (url) => { const r = await origWeb(url); Track.log('audit_created', { type: 'web' }); return r; };
})();

/* ══ 3) ONBOARDING DIAGNOSTIKA ══
   Nový používateľ nezačína slepo od lekcie 1: cieľ → skúsenosti →
   vstupný test (12 otázok, 4 z každého modulu) → baseline per modul
   → odporúčaná študijná cesta na dashboarde. */
const Onboard = {
  test: null,
  maybeShow() {
    if (App.state.onboarding || Object.keys(App.state.completedLessons).length > 3) return;
    this.stepGoal();
  },
  stepGoal() {
    App.modal(`
      <div class="text-center mb-4"><div class="text-3xl mb-1">👋</div>
      <h3 class="font-bold text-lg text-zinc-900 dark:text-white">Vitaj! Nastavme ti študijnú cestu</h3>
      <p class="text-xs text-zinc-500">2 otázky + krátky vstupný test (12 otázok) — potom presne uvidíš, kde začať.</p></div>
      <label class="text-xs font-semibold text-zinc-500">Aký je tvoj cieľ?</label>
      <div class="grid gap-1.5 mt-1 mb-3">
        ${[['agency', '💼 Zamestnať sa v agentúre'], ['freelance', '🚀 Vlastní klienti / freelancing'], ['own', '🏪 Marketing pre vlastnú firmu'], ['cert', '🎓 Hlavne certifikácie']].map(([v, t]) =>
          `<label class="flex items-center gap-2 rounded-xl border border-zinc-200 dark:border-zinc-700 px-3 py-2 text-sm cursor-pointer has-[:checked]:border-indigo-500"><input type="radio" name="ob-goal" value="${v}" class="accent-indigo-500">${t}</label>`).join('')}
      </div>
      <label class="text-xs font-semibold text-zinc-500">Skúsenosti s Google marketingom?</label>
      <div class="grid gap-1.5 mt-1 mb-4">
        ${[['none', '🌱 Úplný začiatočník'], ['some', '🌿 Niečo som už skúšal(a)'], ['pro', '🌳 Pracujem s tým, chcem sa zlepšiť']].map(([v, t]) =>
          `<label class="flex items-center gap-2 rounded-xl border border-zinc-200 dark:border-zinc-700 px-3 py-2 text-sm cursor-pointer has-[:checked]:border-indigo-500"><input type="radio" name="ob-exp" value="${v}" class="accent-indigo-500">${t}</label>`).join('')}
      </div>
      <button onclick="Onboard.stepTest()" class="btn-press w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Pokračovať na vstupný test →</button>
      <button onclick="Onboard.skip()" class="w-full text-center text-xs text-zinc-500 hover:text-indigo-400 mt-2">Preskočiť diagnostiku</button>`, false);
  },
  stepTest() {
    const goal = document.querySelector('input[name="ob-goal"]:checked')?.value || 'freelance';
    const exp = document.querySelector('input[name="ob-exp"]:checked')?.value || 'none';
    // 4 otázky z každého modulu (z prvých sekcií — reprezentatívne základy)
    const qs = DATA.modules.flatMap(m => App.sample(m.sections[0].lessons.flatMap(l => l.quiz.map((q, i) => ({ ...q, mod: m.id, src: l.id + ':' + i }))), 4));
    this.test = { goal, exp, qs, idx: 0, answers: [] };
    this.renderQ();
  },
  renderQ() {
    const t = this.test;
    if (t.idx >= t.qs.length) { this.finish(); return; }
    const q = t.qs[t.idx];
    App.modal(`
      <div class="text-xs text-zinc-500 mb-2">Vstupný test · otázka ${t.idx + 1}/${t.qs.length} · ${App.getModule(q.mod).short}</div>
      ${Views.progressBar((t.idx + 1) / t.qs.length * 100, 'from-indigo-500 to-violet-500', 'h-1.5')}
      <div class="font-semibold text-zinc-900 dark:text-white my-4">${q.q}</div>
      <div class="space-y-2">${q.o.map((o, i) => `<button onclick="Onboard.answer(${i})" class="btn-press w-full text-left px-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-700 hover:border-indigo-400 text-sm"><b class="text-zinc-400 mr-1">${'ABCD'[i]}</b> ${o}</button>`).join('')}</div>
      <p class="text-[11px] text-zinc-500 mt-3">Netipuj nasilu — „neviem" je cenná informácia pre tvoju cestu. Výsledok nič neblokuje.</p>`, false);
  },
  answer(i) { this.test.answers.push(i); this.test.idx++; this.renderQ(); },
  finish() {
    const t = this.test;
    const base = {};
    DATA.modules.forEach(m => {
      const idx = t.qs.map((q, i) => ({ q, i })).filter(x => x.q.mod === m.id);
      const ok = idx.filter(x => t.answers[x.i] === x.q.c).length;
      base[m.id] = Math.round(ok / idx.length * 100);
    });
    // Odporúčaná cesta: moduly od najslabšieho, prvé sekcie
    const order = [...DATA.modules].sort((a, b) => base[a.id] - base[b.id]);
    const path = order.flatMap(m => m.sections.slice(0, 2).map(s => ({ mod: m.id, title: s.title }))).slice(0, 6);
    App.state.onboarding = { goal: t.goal, exp: t.exp, base, path, date: Date.now() };
    App.save();
    Track.log('onboarding_completed', { base, goal: t.goal });
    App.modal(`
      <div class="text-center mb-4"><div class="text-3xl mb-1">🧭</div>
      <h3 class="font-bold text-lg text-zinc-900 dark:text-white">Tvoja diagnostika</h3></div>
      <div class="space-y-2 mb-4">${DATA.modules.map(m => `
        <div class="flex items-center gap-2 text-sm"><span class="w-40">${m.name}</span>
        <div class="flex-1 h-2 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full" style="background:${m.color};width:${base[m.id]}%"></div></div>
        <b class="w-10 text-right text-xs">${base[m.id]} %</b></div>`).join('')}</div>
      <div class="rounded-xl bg-indigo-500/10 border border-indigo-500/20 p-3 text-sm mb-4">
        <b class="text-indigo-400">Odporúčaná cesta:</b>
        <ol class="mt-1 text-xs space-y-0.5 list-decimal pl-4 text-zinc-700 dark:text-zinc-300">${path.map(p => `<li>${p.title} <span class="text-zinc-500">(${App.getModule(p.mod).short})</span></li>`).join('')}</ol>
      </div>
      <button onclick="App.closeModal();App.render()" class="btn-press w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Začať študovať</button>`, false);
  },
  skip() { App.state.onboarding = { skipped: true, date: Date.now() }; App.save(); App.closeModal(); },
};

/* ══ 4) CONFIDENCE SCORE PRE MASTERY ══
   Mastery číslo bez dôvery je zavádzajúce. Confidence low/med/high:
   podľa množstva odpovedí, čerstvosti, konzistencie a prítomnosti praxe. */
Engine.confidence = function (topic) {
  const s = App.state;
  let answers = 0, last = 0, results = [];
  topic.lessons.forEach(id => {
    const q = s.quizResults['lesson:' + id];
    if (q) { answers += q.total; last = Math.max(last, q.date || 0); results.push(q.score / q.total); }
    if (s.completedLessons[id]) last = Math.max(last, s.completedLessons[id]);
  });
  const practice = Object.values(s.projects).some(p => p.status === 'done') || (s.roleplaysDone || 0) > 0 || (s.cases || []).length > 0;
  const days = last ? (Date.now() - last) / 864e5 : 999;
  const variance = results.length > 1 ? Math.max(...results) - Math.min(...results) : 0;
  let score = 0;
  score += answers >= 15 ? 2 : answers >= 5 ? 1 : 0;       // dosť dát?
  score += days < 21 ? 2 : days < 60 ? 1 : 0;               // čerstvé?
  score += variance < 0.3 ? 1 : 0;                           // konzistentné?
  score += practice ? 2 : 0;                                 // overené praxou?
  return score >= 5 ? { key: 'high', label: 'vysoká istota', icon: '●●●' } : score >= 3 ? { key: 'med', label: 'stredná istota', icon: '●●○' } : { key: 'low', label: 'nízka istota', icon: '●○○' };
};
/* Mastery váhy nastaviteľné per modul (kalibrácia váh je hypotéza —
   teoretické témy majú miernejší strop bez praxe) */
Engine.masteryCaps = { gbp: 70, gsc: 75, ads: 65 };
(() => {
  const orig = Engine.mastery.bind(Engine);
  Engine.mastery = function (topic) {
    let m = orig(topic);
    // uvoľni strop podľa modulu (orig má fix 70)
    if (m === 70) m = Math.min(this.masteryCaps[topic.mod] ?? 70, 100);
    return m;
  };
})();
/* Heatmapa: doplň confidence */
(() => {
  const orig = Views.heatmapHTML;
  Views.heatmapHTML = function () {

    <p class="text-[11px] text-zinc-500 mt-3">🎯 Istota odhadov: pri ${lows} z ${weak.length} rozpracovaných tém je <b>nízka</b> (málo odpovedí, žiadna prax alebo staré výsledky) — mastery ber s rezervou, kým nepridáš prax.</p>

})();

/* ══ 7) VALIDAČNÁ VRSTVA ADMIN EDITORA ══
   Uloženie otázky/lekcie prejde kontrolami — editor nie je len
   textové pole, chráni konzistenciu obsahu. */
const Validate = {
  question(d) {
    const errs = [];
    if (!d.q || d.q.length < 10) errs.push('Otázka je príliš krátka.');
    if (!Array.isArray(d.o) || d.o.length !== 4) errs.push('Musia existovať presne 4 možnosti.');
    if (d.o.some(o => !o || o.length < 1)) errs.push('Žiadna možnosť nesmie byť prázdna.');
    const norm = d.o.map(o => (o || '').toLowerCase().trim());
    if (new Set(norm).size !== norm.length) errs.push('Dve možnosti sú identické.');
    if (typeof d.c !== 'number' || d.c < 0 || d.c > 3) errs.push('Neplatný index správnej odpovede.');
    if (!d.e || d.e.length < 15) errs.push('Vysvetlenie chýba alebo je príliš krátke (min. 15 znakov).');
    // mäkká kontrola: vysvetlenie by malo súvisieť so správnou odpoveďou
    if (d.e && d.o[d.c]) {
      const key = norm[d.c].split(/\s+/).filter(w => w.length > 5);
      if (key.length && !key.some(w => d.e.toLowerCase().includes(w.slice(0, 6)))) errs.push('⚠️ Upozornenie: vysvetlenie zrejme neodkazuje na správnu odpoveď — skontroluj súlad.');
    }
    return errs;
  },
  lesson(d) {
    const errs = [];
    if (!d.title || d.title.length < 5) errs.push('Názov je príliš krátky.');
    if (!d.theory || d.theory.replace(/<[^>]+>/g, '').length < 100) errs.push('Teória je príliš krátka (min. 100 znakov textu).');
    if (!Array.isArray(d.checklist) || d.checklist.length < 2) errs.push('Checklist musí mať aspoň 2 položky.');
    if (/<script/i.test(d.theory || '')) errs.push('Teória nesmie obsahovať <script> značky.');
    return errs;
  },
};
(() => {
  const origQ = Views.adminSaveQuestion;

    const c = +([...document.getElementsByName('edq-c-' + i)].find(r => r.checked)?.value ?? l.quiz[i].c);

    };
    const errs = Validate.question(d);
    const hard = errs.filter(e => !e.startsWith('⚠️'));
    if (hard.length) { App.toast('❌ Validácia zlyhala', hard[0], ''); return; }
    if (errs.length && !confirm(errs.join('\n') + '\n\nUložiť napriek upozorneniu?')) return;
    await origQ.call(this, lid, i);
